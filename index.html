<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romeo's Super City Leveler 5000</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;color:#e8f0ff;font:13px/1.5 system-ui,sans-serif;user-select:none}
  canvas{width:100%;height:100%;display:block}
  .p{position:fixed;background:#0b1020aa;padding:8px 12px;border-radius:6px;pointer-events:none;white-space:pre}
  #help{left:12px;top:12px}
  #stats{right:12px;top:12px;text-align:right}
  #cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:2px;opacity:.7}
  #bar{position:fixed;left:50%;bottom:54px;width:220px;margin-left:-110px;height:8px;border:1px solid #fff6;border-radius:4px;display:none}
  #bar i{display:block;height:100%;background:#ffb340;width:0}
  #meter{position:fixed;left:50%;bottom:48px;width:240px;margin-left:-120px;height:10px;border:1px solid #fff6;border-radius:4px;background:#000a;overflow:hidden;pointer-events:none}
  #meter i{display:block;height:100%}
  .bubble{position:fixed;display:none;transform:translate(-50%,-100%);max-width:240px;padding:8px 12px;border-radius:14px;background:#fff;color:#111;font:800 15px/1.2 system-ui,sans-serif;text-align:center;pointer-events:none}
  .bubble::after{content:'';position:absolute;left:50%;top:100%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  #style{position:fixed;left:50%;bottom:20px;width:360px;margin-left:-180px;height:22px;border:2px solid #8cf9;border-radius:6px;background:#000a;overflow:hidden;pointer-events:none}
  #style i{display:block;height:100%;background:#2f86d6;width:0}
  #style span{position:absolute;inset:0;text-align:center;font:700 12px/18px system-ui,sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 1px 3px #000}
  #style.full{border-color:#ffd25a;animation:ultglow .6s infinite alternate}
  #style.full i{background:#ffb81f}
  #style.full span{color:#111;text-shadow:none;font-size:13px}
  @keyframes ultglow{from{box-shadow:0 0 6px #ffb81f}to{box-shadow:0 0 24px 4px #ffd25a}}
  #pop.gold{color:#ffd23f;font-size:38px;text-shadow:0 0 14px #f60,0 2px 4px #000}
  #pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:30px;font-weight:800;letter-spacing:3px;color:#bfe6ff;text-shadow:0 0 12px #17a,0 2px 4px #000;pointer-events:none;white-space:nowrap}
  #boss{position:fixed;left:50%;top:10px;width:420px;margin-left:-210px;text-align:center;font-weight:700;letter-spacing:2px;color:#ffb08a;text-shadow:0 1px 3px #000;pointer-events:none}
  #boss>div{height:9px;border:1px solid #f974;border-radius:5px;background:#0008}
  #boss i,#hp i{display:block;height:100%;border-radius:5px}
  #boss i{background:#ff5a1f}
  #hp{position:fixed;left:16px;bottom:22px;width:220px;height:12px;border:1px solid #fff7;border-radius:6px;background:#0008}
  #hp i{background:#5fe39a}
  #blind{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
  #cross.scoped{width:5px;height:5px;margin:-2.5px;background:#f33;opacity:1;outline:2px solid #fffc;outline-offset:44px}
  #hurt{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 40px #d1200f}
  body.inmenu #help,body.inmenu #stats,body.inmenu #cross,body.inmenu #bar,body.inmenu #style,body.inmenu #meter,body.inmenu #pop,body.inmenu #boss,body.inmenu #hp,body.inmenu #hurt,body.inmenu #msg,body.inmenu .bubble{display:none!important}
  #menu{position:fixed;inset:0;z-index:5;pointer-events:none;font-size:14px}
  #menu *{box-sizing:border-box}
  .pane{position:absolute;pointer-events:auto;background:#0a0f1ee6;border:1px solid #6fb7ff33;border-radius:12px;padding:18px;overflow:auto}
  .center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);max-height:92vh}
  .title{left:6vw;top:50%;transform:translateY(-50%);width:min(340px,88vw);background:none;border:0;overflow:visible}
  .title h1{font-size:34px;line-height:1.15;letter-spacing:1px;margin:0 0 8px;text-shadow:0 0 24px #1769c4}
  .left{left:14px;top:14px;bottom:14px;width:min(300px,30vw)}
  .right{right:14px;top:14px;bottom:14px;width:min(400px,36vw)}
  h2{margin:0 0 10px;font-size:19px;letter-spacing:2px}
  .sub{opacity:.65;margin:0 0 14px}
  button{font:inherit;color:#e8f0ff;background:#16213a;border:1px solid #6fb7ff44;border-radius:8px;padding:9px 14px;cursor:pointer}
  button:hover:not(:disabled){background:#22365e;border-color:#8fd0ff}
  button:disabled{opacity:.4;cursor:default}
  .wide{display:block;width:100%;margin:8px 0;text-align:left}
  .go{background:#1769c4;border-color:#9bd6ff;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:14px}
  .card{padding:4px;text-align:center}
  .card img{width:100%;display:block;border-radius:5px}
  .card.sel{border-color:#ffd25a;box-shadow:0 0 0 2px #ffd25a}
  .stat{display:flex;align-items:center;gap:8px;margin:3px 0}
  .stat span{width:84px;opacity:.7}
  .stat i{width:22px;height:8px;border-radius:2px;background:#ffffff1f}
  .stat i.on{background:#4bb8ff}
  .mv{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 0;border-top:1px solid #ffffff14}
  .mv b{color:#ffd25a;font-weight:600}
  .mv small{display:block;opacity:.65}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:7px 0}
  .row button,.row select,.row input{min-width:140px}
  select{font:inherit;color:#e8f0ff;background:#16213a;border:1px solid #6fb7ff44;border-radius:8px;padding:7px}
  #fatal{display:none;position:fixed;inset:0;z-index:50;background:#0b1020;padding:8vh 6vw;overflow:auto;font-size:15px;line-height:1.6;user-select:text}
  #fatal h2{color:#ffd25a;margin:0 0 12px}
  #fatal code{display:block;margin-top:18px;opacity:.7;white-space:pre-wrap;font-size:12px}
  #msg{position:fixed;left:50%;top:62%;transform:translateX(-50%);background:#0b1020dd;padding:12px 22px;border-radius:8px;font-size:15px;text-align:center}
</style>

<div id="fatal"></div>
<script>
// If the game cannot start, say why. A black screen tells nobody anything.
window.startFailed = function (reason, detail) {
  var box = document.getElementById('fatal');
  if (box.style.display === 'block') return;
  box.innerHTML = '<h2>The game could not start</h2><div></div><p><b>Things to try</b></p><ol>' +
    '<li>Use the latest Chrome or Edge on a computer (not a phone).</li>' +
    '<li>In the browser settings, turn on "Use graphics acceleration when available", then restart the browser.</li>' +
    '<li>Update the browser and graphics drivers.</li>' +
    '<li>Type chrome://gpu (or edge://gpu) in the address bar and look for the WebGPU line.</li></ol>' +
    '<p>If none of that helps, send this whole screen to whoever shared the link.</p><code></code>';
  box.children[1].textContent = reason;
  box.querySelector('code').textContent = (detail ? detail + '\n' : '') + 'WebGPU available: ' + (!!navigator.gpu) + '\nSecure page: ' + window.isSecureContext + '\nBrowser: ' + navigator.userAgent;
  box.style.display = 'block';
};
addEventListener('error', function (e) { if (!window.started) startFailed('A script error stopped the game.', e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
addEventListener('unhandledrejection', function (e) { if (!window.started) startFailed('Starting the graphics failed.', String(e.reason && e.reason.message || e.reason)); });
setTimeout(function () { if (!window.started) startFailed('The game is still not running after 30 seconds. The graphics driver may be stuck.'); }, 30000);
</script>
<script type="module">
'use strict';
// ───────────────────────── constants ─────────────────────────
const V = 3;                 // voxel size (m)
const BLOCK = 48;            // city block pitch (m)
const HALF = 6;              // city spans [-HALF, HALF) blocks
const MAX_STATIC = 160000;   // instance capacity for the city
const MAX_DYN = 4600;
const NDEB = 2048;           // GPU debris particles
const STEP = 1 / 120;

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 1;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + Math.random() * (b - a);

// ───────────────────────── world ─────────────────────────
let buildings = [], blocks = new Map(), cityDirty = true;
const PALETTE = [[.55,.58,.66],[.72,.62,.52],[.45,.55,.62],[.66,.46,.40],[.80,.77,.70],[.38,.42,.52]];

const blockKey = (bx, bz) => (bx + 64) * 128 + bz + 64;
function genCity() {
  seed = 20260; buildings = []; blocks = new Map(); cityDirty = true;
  for (let bx = -HALF; bx < HALF; bx++) for (let bz = -HALF; bz < HALF; bz++) {
    if ((bx === 0 || bx === -1) && (bz === 0 || bz === -1)) continue;   // spawn plaza
    const list = [], ox = bx * BLOCK + 9, oz = bz * BLOCK + 9;
    const downtown = 1 - Math.min(1, Math.hypot(bx + .5, bz + .5) / HALF);
    const add = (x, z, nx, nz, ny) => {
      const b = { x, z, nx, ny, nz, color: PALETTE[rnd() * PALETTE.length | 0], vox: null, falling: [], dirty: true, cache: null };
      list.push(b); buildings.push(b);
    };
    const h = () => 8 + (rnd() * (14 + downtown * 46) | 0);   // storeys of 3 m, tallest downtown
    if (rnd() < .45) add(ox, oz, 10, 10, h());
    else for (const dx of [0, 18]) for (const dz of [0, 18]) if (rnd() < .8) add(ox + dx, oz + dz, 4, 4, h());
    blocks.set(blockKey(bx, bz), list);
  }
}

// Does an axis-aligned box touch anything solid?
function hit(x0, y0, z0, x1, y1, z1) {
  if (y0 < 0) return true;
  for (let bx = Math.floor(x0 / BLOCK); bx <= Math.floor(x1 / BLOCK); bx++)
  for (let bz = Math.floor(z0 / BLOCK); bz <= Math.floor(z1 / BLOCK); bz++) {
    const list = blocks.get(blockKey(bx, bz));
    if (!list) continue;
    for (const b of list) {
      if (x1 <= b.x || x0 >= b.x + b.nx * V || z1 <= b.z || z0 >= b.z + b.nz * V || y0 >= b.ny * V) continue;
      if (!b.vox) return true;
      const i0 = Math.max(0, Math.floor((x0 - b.x) / V)), i1 = Math.min(b.nx - 1, Math.floor((x1 - b.x) / V));
      const j0 = Math.max(0, Math.floor(y0 / V)),         j1 = Math.min(b.ny - 1, Math.floor(y1 / V));
      const k0 = Math.max(0, Math.floor((z0 - b.z) / V)), k1 = Math.min(b.nz - 1, Math.floor((z1 - b.z) / V));
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k <= k1; k++)
        if (b.vox[i + b.nx * (j + b.ny * k)]) return true;
    }
  }
  return false;
}
const hitPoint = (x, y, z, r = .15) => hit(x - r, y - r, z - r, x + r, y + r, z + r);

function raycast(o, d, max) {
  for (let t = 0; t < max; t += .6) {
    const x = o[0] + d[0] * t, y = o[1] + d[1] * t, z = o[2] + d[2] * t;
    if (hitPoint(x, y, z)) return { t, p: [x, y, z] };
  }
  return null;
}

// ───────────────────────── destruction ─────────────────────────
const debrisQueue = [];
// Online, particles my fighter makes are noted here and replayed on the other screen.
// Destruction is not noted: the other side repeats the carve and gets its own rubble.
let fxLog = null;                          // a list only while my own fighter is being simulated
const tidy = v => Math.round(v * 10) / 10;
function noteFx(...a) {
  if (fxLog && fxLog.length < (a[0] === 'd' || a[0] === 'f' ? 70 : 100)) fxLog.push(a.map(v => typeof v === 'number' ? tidy(v) : v));
}
function quietly(make) { const log = fxLog; fxLog = null; try { return make(); } finally { fxLog = log; } }
function debris(x, y, z, size, col, vx, vy, vz, life) {
  if (fxLog) noteFx('d', x, y, z, size, col.map(tidy), vx, vy, vz, life);
  if (debrisQueue.length >= NDEB) return;
  debrisQueue.push([x, y, z, size, vx, vy, vz, life, col[0], col[1], col[2], rr(0, 6)]);
}
function dust(x, y, z, n, speed) {
  if (fxLog) noteFx('u', x, y, z, n, speed);
  quietly(() => {
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + rr(0, .3), s = speed * rr(.6, 1.2);
      debris(x, y + .3, z, rr(.25, .8), [.62, .6, .57], Math.cos(a) * s, rr(2, 9), Math.sin(a) * s, rr(.5, 1.3));
    }
  });
}

let byEnemy = false;
// online, how many holes a frame can send: enough for a railgun laser through a row of towers (about 4.5 kB)
const CARVE_SYNC = 150;
// Remove every voxel within radius r of (x,y,z). Returns number removed.
function carve(x, y, z, r, push = 14) {
  if (truce.t > 0) return 0;                       // a truce spares the city too
  if (fxLog) return quietly(() => carve(x, y, z, r, push));
  let removed = 0;
  if (!byEnemy) strikeEnemy(x, y, z, r);
  if (pvp && !remoteCarve && pvp.carves.length < CARVE_SYNC) pvp.carves.push([+x.toFixed(2), +y.toFixed(2), +z.toFixed(2), +r.toFixed(2), push | 0]);
  disturb(x, y, z, r);
  for (const b of buildings) {
    if (x + r <= b.x || x - r >= b.x + b.nx * V || z + r <= b.z || z - r >= b.z + b.nz * V || y - r >= b.ny * V) continue;
    let touched = false;
    const i0 = Math.max(0, Math.floor((x - r - b.x) / V)), i1 = Math.min(b.nx - 1, Math.floor((x + r - b.x) / V));
    const j0 = Math.max(0, Math.floor((y - r) / V)),       j1 = Math.min(b.ny - 1, Math.floor((y + r) / V));
    const k0 = Math.max(0, Math.floor((z - r - b.z) / V)), k1 = Math.min(b.nz - 1, Math.floor((z + r - b.z) / V));
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k <= k1; k++) {
      const cx = b.x + (i + .5) * V, cy = (j + .5) * V, cz = b.z + (k + .5) * V;
      const dx = cx - x, dy = cy - y, dz = cz - z, d = Math.hypot(dx, dy, dz);
      if (d > r) continue;
      if (!b.vox) b.vox = new Uint8Array(b.nx * b.ny * b.nz).fill(1);   // voxelise on first damage
      const id = i + b.nx * (j + b.ny * k);
      if (!b.vox[id]) continue;
      b.vox[id] = 0; removed++; touched = true;
      const inv = push / (d + 1);
      const n = removed < 60 ? 4 : 1;
      for (let p = 0; p < n; p++)
        debris(cx + rr(-1, 1), cy + rr(-1, 1), cz + rr(-1, 1), rr(.4, 1.4), b.color,
               dx * inv + rr(-6, 6), dy * inv + rr(0, 12), dz * inv + rr(-6, 6), rr(2, 4.5));
    }
    if (touched) { b.dirty = cityDirty = true; checkSupport(b); }
  }
  return removed;
}

// Anything not connected to the ground, or resting on a too-thin floor, collapses.
// vox: 0 empty, 1 solid, 2 queued to fall.
function checkSupport(b) {
  const { nx, ny, nz, vox } = b, n = vox.length, layer = nx * ny;
  const seen = new Uint8Array(n), stack = [];
  const visit = id => { if (vox[id] === 1 && !seen[id]) { seen[id] = 1; stack.push(id); } };
  for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) visit(i + layer * k);
  while (stack.length) {
    const id = stack.pop(), i = id % nx, j = (id / nx | 0) % ny, k = id / layer | 0;
    if (i > 0) visit(id - 1);      if (i < nx - 1) visit(id + 1);
    if (j > 0) visit(id - nx);     if (j < ny - 1) visit(id + nx);
    if (k > 0) visit(id - layer);  if (k < nz - 1) visit(id + layer);
  }
  let cut = ny;   // first layer that can no longer be held up
  for (let j = 0; j < ny - 1; j++) {
    let c = 0;
    for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) if (vox[i + nx * j + layer * k] === 1) c++;
    if (c < nx * nz * .3) { cut = j + 1; break; }
  }
  for (let j = 0; j < ny; j++)
    for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) {
      const id = i + nx * j + layer * k;
      if (vox[id] === 1 && (!seen[id] || j >= cut)) { vox[id] = 2; b.falling.push(id); }
    }
}

let rumble = 0;
function updateCollapse(dt) {
  for (const b of buildings) {
    if (!b.falling.length) continue;
    const { nx, ny } = b;
    let count = Math.max(1, Math.ceil(dt * Math.max(90, b.falling.length * 2.2)));
    for (const id of b.falling.splice(0, count)) {
      if (!b.vox[id]) continue;
      b.vox[id] = 0;
      const x = b.x + (id % nx + .5) * V, y = (((id / nx | 0) % ny) + .5) * V, z = b.z + ((id / (nx * ny) | 0) + .5) * V;
      if (Math.random() < .6) debris(x, y, z, rr(1.2, 2.6), b.color, rr(-5, 5), rr(-8, 1), rr(-5, 5), rr(2.5, 5));
      if (y < V * 2 && Math.random() < .15) dust(x, 0, z, 6, 10);
    }
    b.dirty = cityDirty = true; rumble = .15;
  }
}

// ───────────────────────── city → instances ─────────────────────────
// instance: pos.xyz, material, size.xyz, yaw, color.rgb, pitch
function inst(a, o, x, y, z, m, sx, sy, sz, yaw, c, pitch) {
  a[o] = x; a[o+1] = y; a[o+2] = z; a[o+3] = m;
  a[o+4] = sx; a[o+5] = sy; a[o+6] = sz; a[o+7] = yaw;
  a[o+8] = c[0]; a[o+9] = c[1]; a[o+10] = c[2]; a[o+11] = pitch;
}
function meshBuilding(b) {
  const { nx, ny, nz, vox, color } = b;
  if (!vox) {   // intact building = ONE instance
    const a = new Float32Array(12);
    inst(a, 0, b.x + nx * V / 2, ny * V / 2, b.z + nz * V / 2, 1, nx * V, ny * V, nz * V, 0, color, 0);
    return a;
  }
  const out = new Float32Array(vox.length * 12);
  let o = 0;
  const solid = (i, j, k) => j < 0 || (i >= 0 && j < ny && k >= 0 && i < nx && k < nz && vox[i + nx * (j + ny * k)] > 0);
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    if (!vox[i + nx * (j + ny * k)]) continue;
    if (solid(i-1,j,k) && solid(i+1,j,k) && solid(i,j-1,k) && solid(i,j+1,k) && solid(i,j,k-1) && solid(i,j,k+1)) continue;
    const outer = (i === 0) | (i === nx-1) << 1 | (j === 0) << 2 | (j === ny-1) << 3 | (k === 0) << 4 | (k === nz-1) << 5;
    inst(out, o, b.x + (i + .5) * V, (j + .5) * V, b.z + (k + .5) * V, 10 + outer, V, V, V, 0, color, 0);
    o += 12;
  }
  return out.slice(0, o);
}
const staticData = new Float32Array(MAX_STATIC * 12);
let staticCount = 0, sortX = 0, sortZ = 0, meshAge = 1;
function meshCity() {
  let o = 0;
  sortX = P.x; sortZ = P.z;
  const dist = b => (b.x + b.nx * V / 2 - sortX) ** 2 + (b.z + b.nz * V / 2 - sortZ) ** 2;
  for (const b of [...buildings].sort((a, c) => dist(a) - dist(c))) {
    if (b.dirty) { b.cache = meshBuilding(b); b.dirty = false; }
    if (o + b.cache.length > staticData.length) break;
    staticData.set(b.cache, o); o += b.cache.length;
  }
  staticCount = o / 12; cityDirty = false;
}

// ───────────────────────── input ─────────────────────────
const keys = new Set(), pressed = new Set(), released = new Set();
const press = k => { if (!keys.has(k)) pressed.add(k); keys.add(k); };
const release = k => { if (keys.delete(k)) released.add(k); };
const cam = { yaw: .7, pitch: -.05, dist: 10, shake: 0, fov: 70, pos: [0, 5, -10] };

// ───────────────────────── player ─────────────────────────
const P = {};

fn rollOf(m: f32) -> f32 { let f = fract(m); return select((f - 0.5) * 6.2957, 0.0, f == 0.0); }
fn rolled(p: vec3f, roll: f32) -> vec3f {

}
fn rot(p: vec3f, yaw: f32, pitch: f32) -> vec3f { return turn(p, yaw, pitch, 0.0); }
fn turn(p: vec3f, yaw: f32, pitch: f32, roll: f32) -> vec3f {
  let cp = cos(pitch); let sp = sin(pitch);

  let cy = cos(yaw); let sy = sin(yaw);
  return vec3f(q.x * cy + q.z * sy, q.y, q.z * cy - q.x * sy);
}
fn shade(base: vec3f, n: vec3f, w: vec3f, emit: vec3f) -> vec4f {
  let sun = max(dot(n, normalize(SUN)), 0.0);

const BOX_WGSL = COMMON + /* wgsl */`
struct VOut { @builtin(position) pos: vec4f, @location(0) w: vec3f, @location(1) n: vec3f, @location(2) color: vec3f,
              @location(3) @interpolate(flat) mat: u32, @location(4) @interpolate(flat) face: u32 };
@vertex fn vs(@builtin(vertex_index) vi: u32, @location(0) a: vec4f, @location(1) b: vec4f, @location(2) c: vec4f) -> VOut {
  let roll = rollOf(a.w);
  let cy = cos(b.w); let sy = sin(b.w); let e = u.eye.xyz - a.xyz;
  let un = rolled(vec3f(e.x * cy - e.z * sy, e.y, e.z * cy + e.x * sy), -roll);
  let local = unrot(un, 0.0, c.w);
  let k = cube(vi, local);
  var o: VOut;
  o.w = a.xyz + turn(k[0] * b.xyz, b.w, c.w, roll);
  o.n = turn(k[1], b.w, c.w, roll);
  o.pos = u.vp * vec4f(o.w, 1.0);
  o.color = c.rgb; o.mat = u32(a.w); o.face = (vi / 6u) * 2u + select(0u, 1u, local[vi / 6u] > 0.0);
  return o;
}
@fragment fn fs(i: VOut) -> @location(0) vec4f {
  var base = i.color; var emit = vec3f(0); let n = normalize(i.n); let w = i.w;
  let facade = i.mat == 1u || (i.mat >= 10u && (((i.mat - 10u) >> i.face) & 1u) == 1u);
  // derivatives must be taken in uniform control flow
  let h = select(w.x, w.z, abs(n.x) > 0.5);
  let cell = vec2f(h / 3.0, w.y / 3.0);
  let fw = fwidth(cell);
  let gw = fwidth(w.xz);
  if (facade) {
    if (abs(n.y) < 0.5) {
      let f = fract(cell);
      let wx = smoothstep(0.18 - fw.x, 0.18 + fw.x, f.x) - smoothstep(0.82 - fw.x, 0.82 + fw.x, f.x);
      let wy = smoothstep(0.22 - fw.y, 0.22 + fw.y, f.y) - smoothstep(0.80 - fw.y, 0.80 + fw.y, f.y);
      let far = clamp((max(fw.x, fw.y) - 0.15) * 3.0, 0.0, 1.0);
      let win = mix(wx * wy, 0.37, far);
      let id = floor(cell) + vec2f(select(0.0, 37.0, abs(n.x) > 0.5), 0.0);
      let r = hash(id);
      let refl = mix(vec3f(0.75, 0.52, 0.45), vec3f(0.2, 0.3, 0.55), clamp((w.y - u.eye.y) / 60.0 + 0.3, 0.0, 1.0));
      base = mix(base, mix(vec3f(0.06, 0.09, 0.14), refl * 0.5, 0.5), win);
      emit = vec3f(1.0, 0.68, 0.32) * win * step(0.83, r) * (1.0 - far * 0.7) * 0.7;
      if (w.y < 3.0) { base *= 0.6; }
    } else { base *= 0.55; }
  } else if (i.mat >= 10u) {
    // broken interior: raw concrete with a rebar-like band
    let p = floor(w * 2.5);
    let g = hash(p.xy + p.z * 17.0);
    base = mix(vec3f(0.34, 0.31, 0.29), i.color * 0.55, 0.3) * (0.75 + g * 0.4);
    if (abs(fract(w.y / 3.0) - 0.5) < 0.05) { base *= vec3f(0.7, 0.45, 0.35); }
  } else if (i.mat == 2u) {
    let g = fract(w.xz / 48.0) * 48.0;
    let road = g.x < 7.0 || g.x > 41.0 || g.y < 7.0 || g.y > 41.0;
    if (road) {
      base = vec3f(0.11, 0.12, 0.14);
      let lx = min(g.x, 48.0 - g.x); let lz = min(g.y, 48.0 - g.y);
      let fade = 1.0 - clamp(max(gw.x, gw.y) - 0.3, 0.0, 1.0);
      if ((lx < 0.18 && lz > 7.0 && fract(w.z / 6.0) < 0.5) || (lz < 0.18 && lx > 7.0 && fract(w.x / 6.0) < 0.5)) { base = mix(base, vec3f(0.9, 0.75, 0.3), fade); }
    } else {
      base = vec3f(0.34, 0.33, 0.33) * (0.9 + 0.1 * hash(floor(w.xz / 3.0)));
    }
    for (var c = 0; c < 16; c++) {
      let cr = u.craters[c];
      let d = w.xz - cr.xy;
      if (cr.w > 0.0 && dot(d, d) < cr.z * cr.z * 2.25) {
        let ang = atan2(d.y, d.x);
        let dist = length(d) / cr.z;
        let crack = step(0.975, abs(sin(ang * 7.0 + sin(dist * 9.0 + cr.x) * 0.15))) * step(dist, 1.1);
        base *= 1.0 - 0.6 * (1.0 - smoothstep(0.4, 1.0, dist));
        base *= 1.0 - 0.35 * crack;
      }
    }
  } else if (i.mat == 3u) { emit = i.color; }
  // player contact shadow
  let pd = u.player.xyz - w;
  if (n.y > 0.5 && pd.y > -0.2 && pd.y < 40.0) {
    base *= 1.0 - 0.55 * (1.0 - smoothstep(0.3, 1.1, length(pd.xz))) * (1.0 - clamp(pd.y / 40.0, 0.0, 1.0));
  }

}`;

const SKY_WGSL = COMMON + /* wgsl */`
struct VOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VOut {
  let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0;
  return VOut(vec4f(p, 1.0, 1.0), p);
}
@fragment fn fs(i: VOut) -> @location(0) vec4f {
  return vec4f(skyColor(normalize(u.fwd.xyz + u.right.xyz * i.ndc.x + u.up.xyz * i.ndc.y)), 1.0);
}`;

const PARTICLE = /* wgsl */`struct Part { pos: vec3f, size: f32, vel: vec3f, life: f32, color: vec3f, angle: f32 };`;

const SIM_WGSL = PARTICLE + /* wgsl */`
@group(0) @binding(0) var<storage, read_write> parts: array<Part>;
@group(0) @binding(1) var<uniform> dt: vec4f;
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3u) {
  var p = parts[id.x];
  if (p.life <= 0.0) { return; }
  p.life -= dt.x;
  p.vel.y -= 30.0 * dt.x;
  p.pos += p.vel * dt.x;
  p.angle += length(p.vel) * dt.x * 0.25;
  let floorY = p.size * 0.4;
  if (p.pos.y < floorY) {
    p.pos.y = floorY;
    p.vel = vec3f(p.vel.x * 0.6, -p.vel.y * 0.3, p.vel.z * 0.6);
    if (p.vel.y < 2.0) { p.vel.y = 0.0; }

}`;

const DEBRIS_WGSL = COMMON + PARTICLE + /* wgsl */`
@group(1) @binding(0) var<storage, read> parts: array<Part>;
struct VOut { @builtin(position) pos: vec4f, @location(0) w: vec3f, @location(1) n: vec3f, @location(2) color: vec3f };
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
  let p = parts[ii];
  let k = cube(vi, unrot(u.eye.xyz - p.pos, p.angle * 0.7 + f32(ii), p.angle));
  let s = p.size * clamp(p.life * 1.5, 0.0, 1.0);
  var o: VOut;
  o.w = p.pos + rot(k[0] * s, p.angle * 0.7 + f32(ii), p.angle);
  o.n = rot(k[1], p.angle * 0.7 + f32(ii), p.angle);
  o.pos = u.vp * vec4f(o.w, 1.0);
  o.color = p.color;
  return o;
}
@fragment fn fs(i: VOut) -> @location(0) vec4f { return shade(i.color * 0.85, normalize(i.n), i.w, vec3f(0)); }`;

// ───────────────────────── GPU setup ─────────────────────────
const canvas = $('c');

const fallBuf = buf(fallData.byteLength, GPUBufferUsage.VERTEX);

const vis = GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT;

function pipeline(code, layouts, { buffers = [], depthWrite = true, compare = 'less' } = {}) {

    layout: device.createPipelineLayout({ bindGroupLayouts: layouts }),

const [boxPipe, skyPipe, debrisPipe] = await Promise.all([

  pipeline(SKY_WGSL, [sceneLayout], { depthWrite: false, compare: 'less-equal' }),

const simBind = device.createBindGroup({ layout: simPipe.getBindGroupLayout(0), entries: [

const gpuName = [adapter.info?.vendor, adapter.info?.architecture].filter(Boolean).join(' ') || 'unknown';
const integrated = adapter.info?.vendor === 'intel';

let quality = 0, cap60 = true;
let depth = null, debrisHead = 0, debrisLive = 0;
function resize() {
  const budget = (integrated ? 1.4e6 : 3.7e6) * QUALITY[quality][1];
  const dpr = Math.min(devicePixelRatio || 1, Math.sqrt(budget / Math.max(1, canvas.clientWidth * canvas.clientHeight)));

}

function flushDebris() {
  const n = debrisQueue.length;
  if (!n) return;
  const data = new Float32Array(debrisQueue.flat());
  const first = Math.min(n, NDEB - debrisHead);
  device.queue.writeBuffer(partBuf, debrisHead * 48, data, 0, first * 12);
  if (n > first) device.queue.writeBuffer(partBuf, 0, data, first * 12, (n - first) * 12);
  debrisHead = (debrisHead + n) % NDEB;
  debrisLive = 6;               // seconds the particle passes stay enabled
  debrisQueue.length = 0;
}

function resetWorld() {
  genCity(); initLife(); resetPlayer(); fallers = []; gashes = []; resetEnemy(); history = []; popup.t = 0; hitStop = 0; craters.fill(0); thrown.length = 0; debrisQueue.length = 0; truce.t = 0;

let dusk = 0;
// the ultimates, as moves (theirs and the computer's): Reaper Sphere and the railgun are flags of their own
const ULT_MOVES = new Set(['inferno', 'titan', 'ragdoll', 'flare', 'horizon', 'sphere', 'rail']);
function render(dt, time, alpha = 1) {
  // any ultimate darkens the world: mine, the computer's, or the other player's
  const ulting = s => !!s && (ULT_MOVES.has(s.cm?.name) || !!s.storm || !!s.rail || !!s.drive || s.inferno > 0 || s.titan > 0);
  const cutting = ulting(P) || ulting(pvp?.state?.s) || !E.dead && (ULT_MOVES.has(E.move) && (E.state === 'wind' || E.state === 'act') || E.inferno > 0 || E.titan > 0 || !!E.drive);
  dusk = preview ? 0 : dusk + ((cutting ? 1 : 0) - dusk) * Math.min(1, dt * (cutting ? 7 : 2));
  fxDt = dt;
  drawAlpha = alpha;

  meshAge += dt;

  if (preview) previewCamera(time, canvas.width / canvas.height); else updateCamera(dt, time, canvas.width / canvas.height);
  [P.x, P.y, P.z] = real;
  flushDebris();
  device.queue.writeBuffer(dynBuf, 0, dynData, 0, dynCount * 12);
  if (fallCount) device.queue.writeBuffer(fallBuf, 0, fallData, 0, fallCount * 12);
  if (lifeCount) device.queue.writeBuffer(lifeBuf, 0, lifeData, 0, lifeCount * 12);
  ubo[23] = dusk;
  device.queue.writeBuffer(uniformBuf, 0, ubo);
  device.queue.writeBuffer(dtBuf, 0, new Float32Array([dt, 0, 0, 0]));

  const enc = device.createCommandEncoder();

const PROTO = 16;

const LOCAL_NET = new URLSearchParams(location.search).get('net') === 'local';   // two tabs on one computer, for testing
// the parts of a fighter the other side needs in order to draw them
const SHARED = ['x', 'y', 'z', 'vx', 'vy', 'vz', 'yaw', 'phase', 'grounded', 'h', 'wall', 'charge', 'glide', 'dive', 'dash', 'slide', 'mantle', 'kick', 'meteor', 'orbit',
  'chain', 'storm', 'cross', 'guill', 'whirl', 'act', 'punch', 'slashT', 'slashSide', 'carving', 'holding', 'lash', 'reel', 'spin', 'cm', 'leapCharge', 'leaping', 'flying', 'beam', 'reelBlock', 'rail', 'railBeam', 'drive', 'yell', 'look', 'inferno', 'titan', 'hurtT', 'style', 'hp', 'pad', 'trap', 'gun', 'shield'];

const netSend = msg => { try { link?.send(msg); } catch {} };

const loadScript = src => new Promise((ok, no) => {
  if (window.Peer) return ok();
  const tag = document.createElement('script');
  tag.src = src; tag.onload = ok; tag.onerror = () => no(new Error('could not download the networking library'));
  document.head.appendChild(tag);

// a link is { send(msg), close() }; it calls linkUp / onNet / linkDown
function localLink(code, hosting) {
  const ch = new BroadcastChannel('skybreak-' + code), me = hosting ? 'h' : 'g';
  let up = false;
  const api = { send: msg => ch.postMessage({ from: me, msg }), close: () => ch.close(), kind: 'same computer' };
  ch.onmessage = e => {
    const { from, msg } = e.data;
    if (from === me) return;
    if (msg.t === 'knock-knock') { if (!up) { up = true; api.send({ t: 'knock-knock' }); linkUp(api, hosting); } return; }
    onNet(msg);
  };
  if (!hosting) api.send({ t: 'knock-knock' });
  setStatus(hosting ? 'Waiting for your friend. Room code: ' + code : 'Looking for room ' + code + '…');
}
async function peerLink(code, hosting) {
  setStatus('Step 1 of 4: downloading the networking library…');
  await loadScript(PEER_LIB);
  setStatus('Step 2 of 4: reaching the matchmaking server…');
  const peer = new window.Peer(hosting ? 'skybreak-' + code : undefined);   // library defaults: STUN, plus relays if direct fails
  let conn = null, giveUp = 0;
  const wire = c => {
    conn = c;
    setStatus('Step 4 of 4: opening a direct connection…');
    giveUp = setTimeout(() => setStatus('Step 4 failed: neither a direct connection nor the relay got through. A VPN or a strict work or school network is probably blocking it.'), 20000);
    c.on('open', () => {
      clearTimeout(giveUp);
      linkUp({ send: m => c.open && c.send(m), close: () => peer.destroy(), kind: 'peer to peer', pc: c.peerConnection }, hosting);
    });
    c.on('data', onNet);
    c.on('close', () => linkDown('The other player left.'));
    c.on('error', e => linkDown('Connection error: ' + e.type));
  };

    if (hosting) { setStatus('Step 3 of 4: waiting for your friend. Room code: ' + code); peer.on('connection', c => { if (!conn) wire(c); else c.close(); }); }
    else { setStatus('Step 3 of 4: looking for room ' + code + '…'); wire(peer.connect('skybreak-' + code, { reliable: true, serialization: 'json' })); }
  });
  peer.on('error', e => {
    clearTimeout(giveUp);
    const why = { 'peer-unavailable': 'No room with that code. Check it, and make sure the host is still waiting.', network: 'Lost contact with the matchmaking server.',
      'server-error': 'The matchmaking server is not responding.', 'unavailable-id': 'That room code is already in use. Host again.', 'browser-incompatible': 'This browser does not support WebRTC.' }[e.type] || e.type;
    setStatus('Could not connect: ' + why);
  });

}
function openRoom(hosting, code) {
  netClose();

}
function netClose() {
  netSend({ t: 'bye' });

}
function linkDown(why) {
  if (!link) return;

}
function linkUp(api, hosting) {
  link = api;

    const sv = store.get(SAVE_KEY);
    return `<div class="pane title"><h1>Romeo's Super City Leveler 5000</h1><p class="sub">Movement · destruction · duels</p>
      ${btn('New Game', 'new', 'go')}${btn('Multiplayer (1v1 online)', 'multi')}${btn('Load Game' + (sv && ROSTER[sv.who] ? `<br><small>${ROSTER[sv.who].name} vs ${ROSTER[sv.foe].name} · ${sv.when}</small>` : '<br><small>no saved game</small>'), 'load').replace('data-act="load"', 'data-act="load"' + (sv ? '' : ' disabled'))}
      ${btn('Options', 'options')}${btn('Exit', 'exit')}<p class="sub">${notice}${integrated ? '<br>Running on the integrated GPU. Set your browser to High performance in Windows graphics settings for smoother play.' : ''}</p></div>`;
  },
  who: () => selectScreen('who'),
  foe: () => selectScreen('foe'),
  upgrade: () => `<div class="pane center"><h2>CHOOSE AN UPGRADE</h2>
    <p class="sub">Score ${pvp.mine} - ${pvp.theirs} · first to ${WINS}<br>Yours: ${perkNames(who, pvp.perks)}<br>${ROSTER[foe].name}: ${perkNames(foe, pvp.theirPerks)}</p>
    ${pvp.myPick === null ? UPGRADES[who].filter(u => !pvp.perks.has(u[0])).map(([id, name, what]) => `<button class="wide" data-act="upgrade" data-id="${id}"><b>${name}</b><br><small>${what}</small></button>`).join('') + `<p class="sub">You have ${PICK_TIME} seconds; after that the first one is taken.</p>`
      : '<p style="color:#ffd25a">Waiting for the other player to choose…</p>'}
    ${btn('Leave match', 'main')}</div>`,
  result: () => `<div class="pane center"><h2>${pvp.mine > pvp.theirs ? 'YOU WIN THE MATCH' : 'YOU LOSE THE MATCH'}</h2><p class="sub">${ROSTER[who].name} ${pvp.mine} - ${pvp.theirs} ${ROSTER[foe].name}</p>
    ${pvp.again ? '<p style="color:#ffd25a">Waiting for the other player…</p>' : btn(pvp.theyAgain ? 'Rematch (they are ready)' : 'Rematch', 'again', 'go')}${btn('Leave match', 'main')}</div>`,
  pause: () => pvp ? `<div class="pane center"><h2>ONLINE MATCH</h2><p class="sub">${ROSTER[who].name} vs ${ROSTER[foe].name} · ${pvp.mine} - ${pvp.theirs} · ping ${pvp.ping} ms · the match keeps running</p>
    ${btn('Back to the fight', 'resume', 'go')}${pvp.bo5 ? `<p class="sub">Best of 5 · your upgrades: ${perkNames(who, pvp.perks)}</p>` : btn('Change fighter', 'swap')}${btn('Options', 'options')}${btn('Leave match', 'main')}</div>` : `<div class="pane center"><h2>PAUSED</h2><p class="sub">${ROSTER[who].name} vs ${foeName()}${notice ? ' · ' + notice : ''}</p>
    ${btn('Resume', 'resume', 'go')}${btn('Change fighter / rival', 'change')}${btn('Save game', 'save')}${btn('Rematch (rival returns in front of you)', 'rematch')}${btn('Rebuild city', 'rebuild')}${btn('Options', 'options')}${btn('Main menu', 'main')}</div>`,
  options() {
    const row = (label, ctl) => `<div class="row"><span>${label}</span>${ctl}</div>`;
    const tog = (key, label) => row(label, `<button data-act="toggle" data-id="${key}">${settings[key] ? 'On' : 'Off'}</button>`);
    return `<div class="pane center"><h2>OPTIONS</h2>
      ${row('Graphics quality', `<button data-act="quality">${QUALITY[settings.quality][0]}</button>`)}${tog('cap60', 'Steady 60 fps cap')}
      ${row('Sound volume', `<button data-act="volume">${Math.round(settings.volume * 100)}%</button>`)}${tog('help', 'On-screen controls list')}
      ${tog('fullscreen', 'Fullscreen, block browser shortcuts')}${tog('debug', 'Debug mode (no damage, full style)')}${tog('cooldowns', 'Move cooldowns (online, the host decides)')}
      ${row('Debug slow motion', `<button data-act="slow" ${settings.debug ? '' : 'disabled'}>x${settings.slow}</button>`)}
      <p class="sub">Outside fullscreen the browser keeps shortcuts such as Ctrl+W. Avoid binding Ctrl there.</p>
      ${btn('Key bindings ▸', 'keys')}${btn('◂ Back', 'back')}</div>`;
  },
  keys: () => `<div class="pane center"><h2>KEY BINDINGS</h2><p class="sub">${rebinding ? 'Press a key or mouse button. Esc cancels.' : 'Click an action to change it. Taken inputs swap. Esc is always pause.'}</p>
    ${ACTIONS.map(([id, label]) => `<div class="row"><span>${label}</span><button data-act="bind" data-id="${id}">${rebinding === id ? '…' : bound(id)}</button></div>`).join('')}
    ${btn('Reset to defaults', 'resetKeys')}${btn('◂ Back', 'back')}</div>`,
  exit: () => `<div class="pane center"><h2>GOODBYE</h2><p>Your browser does not let a page close a tab you opened yourself. You can close this tab now.</p>${btn('◂ Back to the menu', 'main')}</div>`,
};
function show(name) {
  const same = screen === name;
  screen = name;
  const menu = $('menu'), keep = menu.querySelector('.pane')?.scrollTop;
  menu.innerHTML = name ? SCREENS[name]() : '';
  if (same && keep) menu.querySelector('.pane').scrollTop = keep;             // picking a card must not jump to the top
  document.body.classList.toggle('inmenu', mode === 'menu');
  // which fighter stands behind this screen
  preview = mode !== 'menu' ? null : name === 'who' ? { kind: pickWho, ndc: -.08 } : name === 'foe' ? { kind: pickFoe, ndc: -.08 } : { kind: pickWho, ndc: .4 };
}

// ── matches ──
function setMatch(a, b) {
  who = a; foe = b; preview = null;
  resetWorld(); waves = [];
  P.look = randomLook(); E.look = randomLook();
  $('help').innerHTML = helpHTML();
}
function pause() {
  if (mode !== 'play') return;
  mode = 'pause'; notice = ''; cam.shake = 0; rumble = 0;
  keys.clear(); pressed.clear(); released.clear(); P.charge = -1;
  if (locked()) document.exitPointerLock();
  show('pause');
}
function capture() {
  if (settings.fullscreen && !document.fullscreenElement)
    document.documentElement.requestFullscreen?.().then(() => navigator.keyboard?.lock?.()).catch(() => {});
  const req = canvas.requestPointerLock({ unadjustedMovement: true });
  req?.catch(() => canvas.requestPointerLock()?.catch?.(() => {}));
}
function resume() {
  mode = 'play'; show(null);
  $('help').innerHTML = helpHTML(); $('help').style.display = settings.help ? '' : 'none';
  $('msg').style.display = locked() ? 'none' : 'block';
  initAudio(); capture();
}
function toMain() {
  mode = 'menu'; notice = '';
  if (pvp || link) { netClose(); applySettings(); }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  resetWorld(); show('main');
}
function startMatch(a, b) {
  setMatch(a, b); startTruce(false); resume();
  say(ROSTER[who].name + '  vs  ' + foeName(), 2.4);
}

// ── save / load ──
const pack = a => { const out = []; for (const v of a) { const x = v === 1 ? 1 : 0; if (out.length && out[out.length - 2] === x) out[out.length - 1]++; else out.push(x, 1); } return out; };
function saveGame() {
  const city = [];
  buildings.forEach((b, i) => { if (b.vox) city.push([i, pack(b.vox)]); });
  return store.set(SAVE_KEY, { v: 1, who, foe, when: new Date().toLocaleString(), P: [P.x, P.y, P.z, P.hp, P.style, cam.yaw],
    E: [E.x, E.y, E.z, E.hp, E.awake, E.dead, E.enraged], city });
}
function loadGame() {
  const d = store.get(SAVE_KEY);
  if (!d || d.v !== 1 || !ROSTER[d.who] || !ROSTER[d.foe]) return false;
  setMatch(d.who, d.foe);
  for (const [i, runs] of d.city) {
    const b = buildings[i];
    if (!b) continue;
    b.vox = new Uint8Array(b.nx * b.ny * b.nz);
    let o = 0;
    for (let k = 0; k < runs.length; k += 2) { b.vox.fill(runs[k], o, o + runs[k + 1]); o += runs[k + 1]; }
    b.dirty = true;
  }
  cityDirty = true;
  const [x, y, z, hp, st, yaw] = d.P;
  Object.assign(P, { x, y, z, px: x, py: y, pz: z, hp, style: st, grounded: false }); cam.yaw = yaw;
  const [ex, ey, ez, ehp, awake, dead, enraged] = d.E;
  Object.assign(E, { x: ex, y: ey, z: ez, px: ex, py: ey, pz: ez, hp: ehp, awake, dead, enraged });
  return true;
}

// ── menu clicks ──
const ACT = {
  new() { online = false; pickWho = 'hero'; show('who'); },
  multi() { online = true; netStatus = ''; show('who'); },
  host() { openRoom(true); },
  rounds() { joinCode = $('code').value; settings.bo5 = !settings.bo5; applySettings(); show('mp'); },
  upgrade(id) { pickUpgrade(id); },
  again() { if (!pvp) return; pvp.again = true; netSend({ t: 'again' }); show('result'); upgradesReady(); },
  join() { joinCode = $('code').value; openRoom(false, joinCode); },
  card(id) { if (screen === 'who') pickWho = id; else if (screen === 'swap') swapPick = id; else pickFoe = id; show(screen); },
  change() { online = false; pickWho = who; pickFoe = foe; show('who'); },
  swap() { swapPick = who; show('swap'); },
  doSwap() {
    if (!pvp) return show('main');
    if (swapPick !== who) { pickWho = swapPick; netSend({ t: 'pick', kind: swapPick }); swapMatch(swapPick, foe); }
    resume();
  },
  toFoe() { if (online) return show('mp'); if (pickFoe === pickWho) pickFoe = Object.keys(ROSTER).find(k => k !== pickWho); show('foe'); },
  start() { startMatch(pickWho, pickFoe); },
  load() { if (loadGame()) resume(); else { notice = 'That save could not be read.'; show('main'); } },
  options() { optionsFrom = screen; show('options'); },
  exit() { applySettings(); window.close(); show('exit'); },
  keys() { show('keys'); },
  back() {
    rebinding = null;
    if (screen === 'keys') show('options');
    else if (screen === 'options') show(optionsFrom);
    else if (screen === 'foe') show('who');
    else if (screen === 'mp') { netClose(); show('who'); }
    else if (screen === 'upgrade' || screen === 'result') return;          // these are left by their buttons
    else if (screen === 'swap' || screen === 'who' && mode === 'pause') show('pause');
    else show('main');
  },
  resume, main: toMain,
  save() { notice = saveGame() ? 'Game saved' : 'Could not save (browser storage unavailable)'; show('pause'); },
  rematch() {
    resetEnemy();
    const x = P.x + Math.sin(cam.yaw) * 18, z = P.z + Math.cos(cam.yaw) * 18;
    Object.assign(E, { x, z, y: P.y, px: x, pz: z, py: P.y, awake: true, cd: 1.4 }); P.hp = 100; startTruce(false); resume();
  },
  rebuild() { resetWorld(); resume(); },
  toggle(id) { settings[id] = !settings[id]; applySettings(); show('options'); },
  quality() { settings.quality = (settings.quality + 1) % QUALITY.length; applySettings(); show('options'); },
  volume() { settings.volume = settings.volume >= 1 ? 0 : settings.volume + .25; applySettings(); show('options'); },
  slow() { settings.slow = settings.slow === 1 ? .3 : settings.slow === .3 ? .08 : 1; applySettings(); show('options'); },
  bind(id) { rebinding = id; show('keys'); },
  resetKeys() { settings.binds = defaultBinds(); rebinding = null; applySettings(); show('keys'); },
};
$('menu').addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; return; }
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { initAudio(); ACT[b.dataset.act](b.dataset.id); }
});
function rebind(code) {
  if (code !== 'Escape') {
    const other = ACTIONS.find(([id]) => settings.binds[id] === code)?.[0];
    if (other) settings.binds[other] = settings.binds[rebinding];     // swap, so nothing is left unbound
    settings.binds[rebinding] = code;
    applySettings();
  }
  rebinding = null; show('keys');
}

// ── input ──
const actionsFor = code => ACTIONS.filter(([id]) => settings.binds[id] === code).map(([id]) => id);
addEventListener('keydown', e => {
  if (rebinding) { e.preventDefault(); rebind(e.code); return; }
  if (mode === 'play') {
    e.preventDefault();                                     // nothing pressed in a match reaches the browser
    if (e.code === 'Escape') pause();
    else if (!e.repeat) actionsFor(e.code).forEach(press);
  } else if (e.code === 'Escape') {
    if (mode === 'pause' && screen === 'pause') return;
    if (screen !== 'main') ACT.back();
  }
});
addEventListener('keyup', e => { if (mode === 'play') { e.preventDefault(); actionsFor(e.code).forEach(release); } });
addEventListener('mousedown', e => {
  if (rebinding) { e.preventDefault(); swallowClick = e.button === 0; rebind('mouse' + e.button); return; }
  if (mode !== 'play') return;
  e.preventDefault();
  if (!locked()) { initAudio(); capture(); return; }
  actionsFor('mouse' + e.button).forEach(press);
}, true);
addEventListener('mouseup', e => { if (e.button > 2) e.preventDefault(); if (mode === 'play') actionsFor('mouse' + e.button).forEach(release); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (!locked() || mode !== 'play') return;
  cam.turnTo = undefined;
  const sens = P.scope ? .45 : 1;
  cam.yaw -= e.movementX * .0024 * sens;
  cam.pitch = clamp(cam.pitch - e.movementY * .0022 * sens, -1.35, 1.25);
});
addEventListener('blur', () => { keys.clear(); pressed.clear(); released.clear(); pause(); });
addEventListener('beforeunload', e => { if (mode !== 'menu') { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('pointerlockchange', () => {
  $('msg').style.display = locked() ? 'none' : 'block';
  if (!locked()) pause();
});

applySettings();
resetWorld();
// card thumbnails are photographs of the real models
{
  const shot = document.createElement('canvas'); shot.width = 150; shot.height = 190;
  const g = shot.getContext('2d');
  for (const kind of Object.keys(ROSTER)) {
    preview = { kind, ndc: 0, still: true };
    for (let i = 0; i < 12; i++) render(0, 1 + i * .05);
    const h = canvas.height * .82, w = h * 150 / 190;
    g.drawImage(canvas, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h, 0, 0, 150, 190);
    thumbs[kind] = shot.toDataURL('image/jpeg', .85);
  }
}
show('main');
window.started = true;
let last = performance.now(), acc = 0, time = 0, frames = 0, statT = 0;
let due = 0, aimT = 0;
// a speech bubble over a head: the world point, put through the camera matrix
function bubble(el, yell, x, y, z) {
  const text = yell && CUSSES[yell.i], m = ubo;
  const w = m[3] * x + m[7] * y + m[11] * z + m[15];
  if (!text || !(w > 0)) { if (el.style.display) el.style.display = ''; return; }
  el.textContent = text; el.style.display = 'block';
  el.style.left = ((m[0] * x + m[4] * y + m[8] * z + m[12]) / w * .5 + .5) * innerWidth + 'px';
  el.style.top = (.5 - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w * .5) * innerHeight + 'px';
}
const bubbles = document.getElementsByClassName('bubble');
function frame(now) {
  if (cap60) {
    if (now < due - 3) { requestAnimationFrame(frame); return; }
    due = Math.max(due + 1000 / 60, now);
  }
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000));
  last = now; acc += (hitStop > 0 ? .12 : 1) * dt * timeScale; hitStop -= dt;   // brief freeze sells heavy hits
  time += dt * timeScale; frames++; statT += dt;
  const playing = pvp ? mode !== 'menu' : mode === 'play' && locked();
  fighting = playing;
  if (playing) {
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    updateCollapse(dt * timeScale);
    updateLife(dt * timeScale);
  } else acc = 0;
  if ((aimT += dt) > .1) {
    aimT = 0;
    const look = lookDir(), ok = raycast(aimOrigin(look), look, RANGE);
    $('cross').style.cssText = ok ? 'background:#ffb340;transform:scale(2.2);opacity:1' : '';
  }
  render(playing || mode === 'menu' ? dt : 0, time, playing ? acc / STEP : 1);
  $('style').firstChild.style.width = P.style + '%';
  bubble(bubbles[0], P.yell, P.x, P.y + (P.drive ? 2.5 : 2.3), P.z);
  bubble(bubbles[1], E.dead ? null : pvp ? pvp.state?.s?.yell : E.yell, E.x, E.y + (E.drive || pvp?.state?.s?.drive ? 2.5 : 2.3), E.z);
  $('meter').style.display = who === 'halo' || who === 'cinder' ? '' : 'none';
  $('meter').firstChild.style.width = (who === 'halo' ? P.sun : P.empower > 0 ? 100 : P.heat) + '%';
  $('meter').firstChild.style.background = who === 'halo' ? (P.sun < 25 ? '#c96a20' : '#ffd23a') : P.empower > 0 ? '#fff0b0' : '#ff5a1f';
  $('style').className = P.style >= 100 ? 'full' : '';
  $('style').lastChild.textContent = (who === 'shoot' ? (P.gun ? 'SHOTGUN · ' : 'RIFLE · ') + (P.reload > 0 ? 'RELOADING · ' : 'AMMO ' + P.ammo + ' · ') : '') + (P.style >= 100 ? 'ULT READY · PRESS ' + bound('KeyQ').toUpperCase() : 'ULT ' + Math.floor(P.style) + '%');
  $('pop').textContent = popup.t > 0 ? popup.text : '';
  $('pop').className = popup.gold ? 'gold' : '';
  const away = Math.hypot(E.x - P.x, E.z - P.z);
  $('boss').style.display = E.dead ? 'none' : 'block';
  const tone = foe === who || foe === 'hero' ? '#3fa0ff' : foe === 'brute' ? '#d8523a' : foe === 'halo' ? '#f2c53d' : foe === 'slash' ? '#e0305a' : foe === 'shoot' ? '#14b8a6' : foe === 'civ' ? '#c9c9c9' : '#ff5a1f';
  $('boss').style.color = '#ffe0d0';
  $('boss').children[1].firstChild.style.background = tone;
  $('boss').children[0].textContent = (pvp ? 'OPPONENT · ' + ROSTER[foe].name + ' · ' + pvp.mine + '-' + pvp.theirs + ' · ' + pvp.ping + ' ms' : foeName()) + (E.awake ? '' : ' (waiting)') + '  ·  ' + away.toFixed(0) + ' m';
  $('boss').children[1].firstChild.style.width = E.hp / E.max * 100 + '%';
  $('hp').firstChild.style.width = Math.max(0, P.hp) + '%';
  $('cross').className = P.scope ? 'scoped' : '';
  $('blind').style.opacity = clamp(P.blindT, 0, 1) * .96;
  $('hurt').style.opacity = Math.max(0, P.hurtT * 2, P.hp < 30 ? .3 : 0);
  const charge = P.leapCharge > .16 ? clamp((P.leapCharge - .16) / .8, 0, 1) : P.charge;
  $('bar').style.display = charge > .05 ? 'block' : 'none';
  $('bar').firstChild.style.width = (charge * 100) + '%';
  if (statT > .5) {
    const fps = frames / statT;
    $('stats').textContent = `${fps.toFixed(0)} fps${cap60 ? ' (cap 60)' : ''} · ${canvas.width}×${canvas.height}\nGPU: ${gpuName} · ${QUALITY[quality][0]}\n${(staticCount + dynCount + lifeCount).toLocaleString()} boxes\n`
      + `${Math.hypot(P.vx, P.vy, P.vz).toFixed(0)} m/s · alt ${P.y.toFixed(0)} m\ndash ${'◆'.repeat(P.dashes)}${'◇'.repeat(Math.max(0, (maxDashes()) - P.dashes))}` + (who === 'brute' ? `\nrush ${P.rushCd > 0 ? Math.ceil(P.rushCd) + 's' : 'ready'}` : '')
      + (debug ? `\n\nDEBUG  style full, endless dash + jump\nspeed x${timeScale}\nanim ${P.act?.name || '-'} · pos ${P.x.toFixed(0)}, ${P.y.toFixed(0)}, ${P.z.toFixed(0)}` : '');
    frames = 0; statT = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const sim60 = () => { fighting = true; for (let i = 0; i < 2; i++) step(STEP); updateCollapse(1 / 60); updateLife(1 / 60); netTick(); };
// console / test hook
window.game = {
  async bench(n = 60) { render(0, 1); await device.queue.onSubmittedWorkDone(); const t = performance.now(); for (let i = 0; i < n; i++) render(0, 1); await device.queue.onSubmittedWorkDone(); return { ms: +((performance.now() - t) / n).toFixed(2), w: canvas.width, h: canvas.height }; },
  P, cam, press, release, step, STEP, carve, updateCollapse, resetWorld, render,
  setDebug(v) { debug = v; }, truce, get fallers() { return fallers; }, openRoom, netTick, netClose, get pvp() { return pvp; }, get netStatus() { return netStatus; }, pick(k) { pickWho = k; }, step60(s) { for (let t = 0; t < s; t += 1 / 60) { sim60(); } }, get roster() { return ROSTER; }, setMatch, get flames() { return flames; }, get rubble() { return rubble; }, get slides() { return slides; }, settings, show, startMatch, saveGame, loadGame, toMain, pause,
  get mode() { return mode; }, get screen() { return screen; }, get who() { return who; }, get foe() { return foe; },
  chooseFighter(name) { setMatch(name, 'cinder'); }, get dyn() { return dynCount; }, E, get waves() { return waves; }, setFighting(v) { fighting = v; }, startMove, damageEnemy,
  get buildings() { return buildings; },
  sim(seconds) { for (let t = 0; t < seconds; t += STEP) { step(STEP); updateCollapse(STEP); updateLife(STEP); } },
  updateLife, get cars() { return cars; }, get civs() { return civs; }, get lifeBoxes() { return lifeCount; },
};
</script>
