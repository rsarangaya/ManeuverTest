<style>

  #style.full{border-color:#ffd25a;animation:ultglow .6s infinite alternate}
  #style.full i{background:#ffb81f}
  #style.full span{color:#111;text-shadow:none;font-size:13px}

<script>
// If the game cannot start, say why. A black screen tells nobody anything.
window.startFailed = function (reason, detail) {
  var box = document.getElementById('fatal');
  if (box.style.display === 'block') return;
  box.innerHTML = '<h2>The game could not start</h2><div></div><p><b>Things to try</b></p><ol>' +
    '<li>Use the latest Chrome or Edge on a computer (not a phone).</li>' +
    '<li>In the browser settings, turn on "Use graphics acceleration when available", then restart the browser.</li>' +
    '<li>Update the browser and graphics drivers.</li>' +
    '<li>Type chrome://gpu (or edge://gpu) in the address bar and look for the WebGPU line.</li></ol>' +
    '<p>If none of that helps, send this whole screen to whoever shared the link.</p><code></code>';
  box.children[1].textContent = reason;
  box.querySelector('code').textContent = (detail ? detail + '\n' : '') + 'WebGPU available: ' + (!!navigator.gpu) + '\nSecure page: ' + window.isSecureContext + '\nBrowser: ' + navigator.userAgent;
  box.style.display = 'block';
};
addEventListener('error', function (e) { if (!window.started) startFailed('A script error stopped the game.', e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
addEventListener('unhandledrejection', function (e) { if (!window.started) startFailed('Starting the graphics failed.', String(e.reason && e.reason.message || e.reason)); });
setTimeout(function () { if (!window.started) startFailed('The game is still not running after 30 seconds. The graphics driver may be stuck.'); }, 30000);
</script>
<script type="module">
'use strict';
// ───────────────────────── constants ─────────────────────────
const V = 3;                 // voxel size (m)
const BLOCK = 48;            // city block pitch (m)
const HALF = 6;              // city spans [-HALF, HALF) blocks
const MAX_STATIC = 160000;   // instance capacity for the city
const MAX_DYN = 4600;
const NDEB = 2048;           // GPU debris particles
const STEP = 1 / 120;

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 1;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + Math.random() * (b - a);

// ───────────────────────── world ─────────────────────────
let buildings = [], blocks = new Map(), cityDirty = true;
const PALETTE = [[.55,.58,.66],[.72,.62,.52],[.45,.55,.62],[.66,.46,.40],[.80,.77,.70],[.38,.42,.52]];

const blockKey = (bx, bz) => (bx + 64) * 128 + bz + 64;
function genCity() {
  seed = 20260; buildings = []; blocks = new Map(); cityDirty = true;
  for (let bx = -HALF; bx < HALF; bx++) for (let bz = -HALF; bz < HALF; bz++) {
    if ((bx === 0 || bx === -1) && (bz === 0 || bz === -1)) continue;   // spawn plaza
    const list = [], ox = bx * BLOCK + 9, oz = bz * BLOCK + 9;
    const downtown = 1 - Math.min(1, Math.hypot(bx + .5, bz + .5) / HALF);
    const add = (x, z, nx, nz, ny) => {
      const b = { x, z, nx, ny, nz, color: PALETTE[rnd() * PALETTE.length | 0], vox: null, falling: [], dirty: true, cache: null };
      list.push(b); buildings.push(b);
    };
    const h = () => 8 + (rnd() * (14 + downtown * 46) | 0);   // storeys of 3 m, tallest downtown
    if (rnd() < .45) add(ox, oz, 10, 10, h());
    else for (const dx of [0, 18]) for (const dz of [0, 18]) if (rnd() < .8) add(ox + dx, oz + dz, 4, 4, h());
    blocks.set(blockKey(bx, bz), list);
  }
}

// Does an axis-aligned box touch anything solid?
function hit(x0, y0, z0, x1, y1, z1) {
  if (y0 < 0) return true;
  for (let bx = Math.floor(x0 / BLOCK); bx <= Math.floor(x1 / BLOCK); bx++)
  for (let bz = Math.floor(z0 / BLOCK); bz <= Math.floor(z1 / BLOCK); bz++) {
    const list = blocks.get(blockKey(bx, bz));
    if (!list) continue;
    for (const b of list) {
      if (x1 <= b.x || x0 >= b.x + b.nx * V || z1 <= b.z || z0 >= b.z + b.nz * V || y0 >= b.ny * V) continue;
      if (!b.vox) return true;
      const i0 = Math.max(0, Math.floor((x0 - b.x) / V)), i1 = Math.min(b.nx - 1, Math.floor((x1 - b.x) / V));
      const j0 = Math.max(0, Math.floor(y0 / V)),         j1 = Math.min(b.ny - 1, Math.floor(y1 / V));
      const k0 = Math.max(0, Math.floor((z0 - b.z) / V)), k1 = Math.min(b.nz - 1, Math.floor((z1 - b.z) / V));
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k <= k1; k++)
        if (b.vox[i + b.nx * (j + b.ny * k)]) return true;
    }
  }
  return false;
}
const hitPoint = (x, y, z, r = .15) => hit(x - r, y - r, z - r, x + r, y + r, z + r);

function raycast(o, d, max) {
  for (let t = 0; t < max; t += .6) {
    const x = o[0] + d[0] * t, y = o[1] + d[1] * t, z = o[2] + d[2] * t;
    if (hitPoint(x, y, z)) return { t, p: [x, y, z] };
  }
  return null;
}

// ───────────────────────── destruction ─────────────────────────
const debrisQueue = [];
function debris(x, y, z, size, col, vx, vy, vz, life) {
  if (debrisQueue.length >= NDEB) return;
  debrisQueue.push([x, y, z, size, vx, vy, vz, life, col[0], col[1], col[2], rr(0, 6)]);
}
function dust(x, y, z, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rr(0, .3), s = speed * rr(.6, 1.2);
    debris(x, y + .3, z, rr(.25, .8), [.62, .6, .57], Math.cos(a) * s, rr(2, 9), Math.sin(a) * s, rr(.5, 1.3));
  }
}

let byEnemy = false;
// Remove every voxel within radius r of (x,y,z). Returns number removed.
function carve(x, y, z, r, push = 14) {
  let removed = 0;
  if (!byEnemy) strikeEnemy(x, y, z, r);
  if (pvp && !remoteCarve && pvp.carves.length < 60) pvp.carves.push([+x.toFixed(2), +y.toFixed(2), +z.toFixed(2), +r.toFixed(2), push | 0]);
  disturb(x, y, z, r);
  for (const b of buildings) {
    if (x + r <= b.x || x - r >= b.x + b.nx * V || z + r <= b.z || z - r >= b.z + b.nz * V || y - r >= b.ny * V) continue;
    let touched = false;
    const i0 = Math.max(0, Math.floor((x - r - b.x) / V)), i1 = Math.min(b.nx - 1, Math.floor((x + r - b.x) / V));
    const j0 = Math.max(0, Math.floor((y - r) / V)),       j1 = Math.min(b.ny - 1, Math.floor((y + r) / V));
    const k0 = Math.max(0, Math.floor((z - r - b.z) / V)), k1 = Math.min(b.nz - 1, Math.floor((z + r - b.z) / V));
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k <= k1; k++) {
      const cx = b.x + (i + .5) * V, cy = (j + .5) * V, cz = b.z + (k + .5) * V;
      const dx = cx - x, dy = cy - y, dz = cz - z, d = Math.hypot(dx, dy, dz);
      if (d > r) continue;
      if (!b.vox) b.vox = new Uint8Array(b.nx * b.ny * b.nz).fill(1);   // voxelise on first damage
      const id = i + b.nx * (j + b.ny * k);
      if (!b.vox[id]) continue;
      b.vox[id] = 0; removed++; touched = true;
      const inv = push / (d + 1);
      const n = removed < 60 ? 4 : 1;
      for (let p = 0; p < n; p++)
        debris(cx + rr(-1, 1), cy + rr(-1, 1), cz + rr(-1, 1), rr(.4, 1.4), b.color,
               dx * inv + rr(-6, 6), dy * inv + rr(0, 12), dz * inv + rr(-6, 6), rr(2, 4.5));
    }
    if (touched) { b.dirty = cityDirty = true; checkSupport(b); }
  }
  return removed;
}

// Anything not connected to the ground, or resting on a too-thin floor, collapses.
// vox: 0 empty, 1 solid, 2 queued to fall.
function checkSupport(b) {
  const { nx, ny, nz, vox } = b, n = vox.length, layer = nx * ny;
  const seen = new Uint8Array(n), stack = [];
  const visit = id => { if (vox[id] === 1 && !seen[id]) { seen[id] = 1; stack.push(id); } };
  for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) visit(i + layer * k);
  while (stack.length) {
    const id = stack.pop(), i = id % nx, j = (id / nx | 0) % ny, k = id / layer | 0;
    if (i > 0) visit(id - 1);      if (i < nx - 1) visit(id + 1);
    if (j > 0) visit(id - nx);     if (j < ny - 1) visit(id + nx);
    if (k > 0) visit(id - layer);  if (k < nz - 1) visit(id + layer);
  }
  let cut = ny;   // first layer that can no longer be held up
  for (let j = 0; j < ny - 1; j++) {
    let c = 0;
    for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) if (vox[i + nx * j + layer * k] === 1) c++;
    if (c < nx * nz * .3) { cut = j + 1; break; }
  }
  for (let j = 0; j < ny; j++)
    for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) {
      const id = i + nx * j + layer * k;
      if (vox[id] === 1 && (!seen[id] || j >= cut)) { vox[id] = 2; b.falling.push(id); }
    }
}

let rumble = 0;
function updateCollapse(dt) {
  for (const b of buildings) {
    if (!b.falling.length) continue;
    const { nx, ny } = b;
    let count = Math.max(1, Math.ceil(dt * Math.max(90, b.falling.length * 2.2)));
    for (const id of b.falling.splice(0, count)) {
      if (!b.vox[id]) continue;
      b.vox[id] = 0;
      const x = b.x + (id % nx + .5) * V, y = (((id / nx | 0) % ny) + .5) * V, z = b.z + ((id / (nx * ny) | 0) + .5) * V;
      if (Math.random() < .6) debris(x, y, z, rr(1.2, 2.6), b.color, rr(-5, 5), rr(-8, 1), rr(-5, 5), rr(2.5, 5));
      if (y < V * 2 && Math.random() < .15) dust(x, 0, z, 6, 10);
    }
    b.dirty = cityDirty = true; rumble = .15;
  }
}

// ───────────────────────── city → instances ─────────────────────────
// instance: pos.xyz, material, size.xyz, yaw, color.rgb, pitch
function inst(a, o, x, y, z, m, sx, sy, sz, yaw, c, pitch) {
  a[o] = x; a[o+1] = y; a[o+2] = z; a[o+3] = m;
  a[o+4] = sx; a[o+5] = sy; a[o+6] = sz; a[o+7] = yaw;
  a[o+8] = c[0]; a[o+9] = c[1]; a[o+10] = c[2]; a[o+11] = pitch;
}
function meshBuilding(b) {
  const { nx, ny, nz, vox, color } = b;
  if (!vox) {   // intact building = ONE instance
    const a = new Float32Array(12);
    inst(a, 0, b.x + nx * V / 2, ny * V / 2, b.z + nz * V / 2, 1, nx * V, ny * V, nz * V, 0, color, 0);
    return a;
  }
  const out = new Float32Array(vox.length * 12);
  let o = 0;
  const solid = (i, j, k) => j < 0 || (i >= 0 && j < ny && k >= 0 && i < nx && k < nz && vox[i + nx * (j + ny * k)] > 0);
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    if (!vox[i + nx * (j + ny * k)]) continue;
    if (solid(i-1,j,k) && solid(i+1,j,k) && solid(i,j-1,k) && solid(i,j+1,k) && solid(i,j,k-1) && solid(i,j,k+1)) continue;
    const outer = (i === 0) | (i === nx-1) << 1 | (j === 0) << 2 | (j === ny-1) << 3 | (k === 0) << 4 | (k === nz-1) << 5;
    inst(out, o, b.x + (i + .5) * V, (j + .5) * V, b.z + (k + .5) * V, 10 + outer, V, V, V, 0, color, 0);
    o += 12;
  }
  return out.slice(0, o);
}
const staticData = new Float32Array(MAX_STATIC * 12);
let staticCount = 0, sortX = 0, sortZ = 0, meshAge = 1;
function meshCity() {
  let o = 0;
  sortX = P.x; sortZ = P.z;
  const dist = b => (b.x + b.nx * V / 2 - sortX) ** 2 + (b.z + b.nz * V / 2 - sortZ) ** 2;
  for (const b of [...buildings].sort((a, c) => dist(a) - dist(c))) {
    if (b.dirty) { b.cache = meshBuilding(b); b.dirty = false; }
    if (o + b.cache.length > staticData.length) break;
    staticData.set(b.cache, o); o += b.cache.length;
  }
  staticCount = o / 12; cityDirty = false;
}

// ───────────────────────── input ─────────────────────────
const keys = new Set(), pressed = new Set(), released = new Set();
const press = k => { if (!keys.has(k)) pressed.add(k); keys.add(k); };
const release = k => { if (keys.delete(k)) released.add(k); };
const cam = { yaw: .7, pitch: -.05, dist: 10, shake: 0, fov: 70, pos: [0, 5, -10] };

// ───────────────────────── player ─────────────────────────
const P = {};
function resetPlayer() {
  Object.assign(P, { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, yaw: .7, grounded: true, wall: null,
    charge: -1, airJumps: 1, dashes: 2, dash: 0, dashDir: [0,0,1], act: null, cm: null, leapCharge: -1, leaping: false, rushCd: 0, stunT: 0, cooled: true, held: null, flying: false, beam: null, swings: 0, hp: 100, iframe: 0, hurtT: 0, style: 0, zipT: 0, atkBuf: 0, hold: 0, cross: null, crossUsed: false, spin: null, chainHits: 0, lastHit: -9, storm: null, meteor: null, guill: null, kick: null, orbit: null, wire: null,
    reelBlock: null, whirl: null, carving: null, wasCarving: false, carveY: undefined, slashSide: 1, glide: false, dive: false, apex: 0,
    punch: 0, cool: 0, phase: 0, holding: null, coyote: 0, wallLock: 0, spaceAir: 0,
    h: 2, slide: false, slideCd: 0, mantle: null, jumpBuf: 0, landT: 1, airPress: false, px: 0, py: 0, pz: 0, chain: null, lash: null, reel: null, slashT: 0 });
  cam.dip = 0; cam.roll = 0; cam.low = 0;
  heroBlank = Object.assign({}, P);
}
const W = .45, H = 2, LOW = 1.15;   // standing / sliding height
const blockedAt = (x, y, z, h = P.h) => hit(x - W, y, z - W, x + W, y + h, z + W);
const thrown = [];
const craters = new Float32Array(16 * 4);
let craterHead = 0;
function addCrater(x, z, r) { craters.set([x, z, r, 1], craterHead * 4); craterHead = (craterHead + 1) % 16; }

// move along one axis; on contact, bisect up to the surface
function moveAxis(axis, d) {
  if (!d) return false;
  const from = P[axis];
  P[axis] = from + d;
  if (!blockedAt(P.x, P.y, P.z)) return false;
  let lo = 0, hi = 1;
  for (let i = 0; i < 8; i++) {
    const m = (lo + hi) / 2;
    P[axis] = from + d * m;
    if (blockedAt(P.x, P.y, P.z)) hi = m; else lo = m;
  }
  P[axis] = from + d * lo;
  return true;
}

function slam(power) {
  const r = clamp(4 + power * .16, 5, 15);
  carve(P.x, P.y + 1, P.z, r, 26);
  if (P.y < 1) addCrater(P.x, P.z, r);
  dust(P.x, P.y, P.z, 40 + r * 6 | 0, r * 2.4);
  cam.shake = Math.min(1.6, r * .11);
  sfx(1, 260, .9);
}

function lookDir() {
  const cp = Math.cos(cam.pitch);
  return [Math.sin(cam.yaw) * cp, Math.sin(cam.pitch), Math.cos(cam.yaw) * cp];
}

// ── kusarigama: the sickle is thrown on its chain; the weighted ball stays in hand ──
const RANGE = 85;

const CORPSE_TIME = 22;

    const along = Math.abs(Math.sin(c.yaw)) > .5, hx = (along ? 2.3 : 1.1) + .45, hz = (along ? 1.1 : 2.3) + .45;

    if (Math.hypot(P.vx, P.vy, P.vz) > 48) { wreckCar(c, P.x - P.vx, P.z - P.vz, 22); continue; }
    if (P.py >= c.y + 1.5 && P.vy <= 0) { P.y = c.y + 1.75; P.vy = 0; P.grounded = true; continue; }

  if (P.guill) { g.aR = -3.0; g.eR = -.3; g.aL = -2.7; g.lean = .5; g.twist = .3; g.lL = -.9; g.kL = 1.3; g.lR = .5; g.kR = .8; g.tail = 2.4; }
  if (P.whirl) {
    const a = P.whirl.a;
    g.aR = -2.85; g.aL = -2.5; g.swR = Math.sin(a) * .6; g.swL = Math.sin(a) * .4; g.twist = Math.sin(a) * .5;
    g.roll = Math.cos(a) * .22; g.lean = Math.sin(a) * .18; g.crouch = .14; g.lL = -.5; g.kL = .6; g.lR = .4; g.kR = .5;
  }
  if (P.act) strikePose(g, P.act.name, P.act.t / P.act.dur, hs);
  if (P.holding && !P.whirl && !P.act) { g.aL = g.aR = -2.9; g.eL = g.eR = -.2; }
  return g;
}

function buildCharacter(time, thrownOut) {
  const g = targetPose(time), dt = clamp(time - pose.t, 0, .05);
  pose.t = time;
  const k = 1 - Math.exp(-(P.act || P.cross || P.storm || P.spin ? 55 : 18) * dt);   // snappy attacks, smooth movement
  for (const key in g) pose[key] += (g[key] - pose[key]) * k;
  const { lean, drop, crouch, roll } = pose;
  const cr = Math.cos(roll), sr = Math.sin(roll);
  let tw = 0;                                        // upper-body twist, 0 while drawing hips and legs

  const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw), cl = Math.cos(lean), sl = Math.sin(lean);
  // local point → world: twist the upper body, lean and roll about the hips, then yaw
  const world = (x, y, z) => {
    const x1 = x * Math.cos(tw) + z * Math.sin(tw), z1 = z * Math.cos(tw) - x * Math.sin(tw);
    const yy = y - 1, y2 = yy * cl - z1 * sl, z2 = yy * sl + z1 * cl;
    const x3 = x1 * cr - y2 * sr, y3 = x1 * sr + y2 * cr + 1;
    return [P.x + x3 * cy + z2 * sy, P.y + y3 - drop, P.z - x3 * sy + z2 * cy];
  };
  const box = (x, y, z, w, h, d, c, m = 0, pitch = 0, turn = 0) => { const p = world(x, y, z); push(p[0], p[1], p[2], m, w, h, d, P.yaw + tw + turn, c, pitch + lean, roll); };
  // a bone hanging from (x, y, z) swung by angle a; returns its far end
  const bone = (x, y, z, a, len, w, d, c) => {
    box(x, y - Math.cos(a) * len / 2, z - Math.sin(a) * len / 2, w, len, d, c, 0, a);
    return [x, y - Math.cos(a) * len, z - Math.sin(a) * len];
  };
  const c = crouch;

  // legs: thigh, shin, boot, knee plate
  for (const [side, a, bend] of [[-1, pose.lL, pose.kL], [1, pose.lR, pose.kR]]) {
    const knee = bone(side * .17, 1.0 - c, 0, a, .5, .23, .25, BLACK);
    const foot = bone(knee[0], knee[1], knee[2], a + bend, .48, .2, .21, NAVY);
    box(knee[0], knee[1], knee[2] + .1, .2, .2, .1, PLATE, 0, a + bend);
    const s = a + bend;
    box(foot[0], foot[1] + .13 * Math.cos(s), foot[2] + .13 * Math.sin(s), .25, .26, .27, BLACK, 0, s);
    box(foot[0], foot[1] + .03, foot[2] + .11, .23, .12, .22, PLATE, 0, s);
  }

  // hips stay square, everything above twists
  box(0, 1.09 - c, 0, .46, .2, .27, BLACK);
  box(0, 1.01 - c, 0, .52, .11, .32, DARKSTEEL);
  box(0, 1.01 - c, .17, .14, .12, .04, STEEL);
  tw = pose.twist * .45;
  box(0, 1.29 - c, 0, .48, .24, .29, NAVY);
  tw = pose.twist;
  box(0, 1.54 - c, 0, .66, .3, .36, NAVY);
  box(-.15, 1.56 - c, .19, .27, .22, .05, PLATE);
  box( .15, 1.56 - c, .19, .27, .22, .05, PLATE);
  box(0, 1.47 - c, .22, .07, .09, .03, GLOW, 3);
  box(0, 1.55 - c, -.21, .12, .42, .07, BLUE);
  box(0, 1.72 - c, 0, .46, .1, .34, BLACK);                           // high collar
  box(-.19, 1.79 - c, .03, .07, .17, .3, NAVY);
  box( .19, 1.79 - c, .03, .07, .17, .3, NAVY);
  box(0, 1.8 - c, -.15, .36, .2, .07, NAVY);

  // head: half mask, glowing eyes, swept-back silver hair
  box(0, 1.93 - c, 0, .31, .33, .31, SKIN);
  box(0, 1.84 - c, .02, .33, .16, .31, BLACK);
  box(-.08, 1.955 - c, .16, .09, .035, .02, GLOW, 3);
  box( .08, 1.955 - c, .16, .09, .035, .02, GLOW, 3);
  box(0, 2.11 - c, -.02, .36, .12, .36, HAIR);
  box(0, 1.97 - c, -.17, .35, .26, .08, HAIR);
  const flow = clamp(Math.hypot(P.vx, P.vy, P.vz) / 45, 0, 1);
  for (let i = 0; i < 5; i++) {
    const x = (i - 2) * .085, wob = Math.sin(time * 9 + i * 2.1) * .08 * flow;
    box(x, 2.15 - c - Math.abs(i - 2) * .025, -.2 - flow * .06, .08, .08, .3 + (i % 2) * .1, HAIR, 0, .35 - flow * .5 + wob);
  }
  box(.05, 2.08 - c, .17, .2, .1, .05, HAIR, 0, .25);                 // fringe

  // arms: layered shoulder on the left, bracers on both
  let handL, handR;
  for (const [side, a, bend, sweep] of [[-1, pose.aL, pose.eL, -pose.swL], [1, pose.aR, pose.eR, pose.swR]]) {
    const sx = side * .43, cs = Math.cos(sweep), sn = Math.sin(sweep);
    const around = (ox, y, z) => [sx + ox * cs + z * sn, y, z * cs - ox * sn];   // rotate about the shoulder
    const put = (ox, y, z, w, h, d, col, m, pitch) => { const q = around(ox, y, z); box(q[0], q[1], q[2], w, h, d, col, m, pitch, sweep); };
    const top = 1.65 - c, s = a + bend;
    const ey = top - Math.cos(a) * .4, ez = -Math.sin(a) * .4, hy = ey - Math.cos(s) * .4, hz = ez - Math.sin(s) * .4;
    const my = (ey + hy) / 2, mz = (ez + hz) / 2;
    put(0, (top + ey) / 2, ez / 2, .18, .4, .19, NAVY, 0, a);
    put(0, my, mz, .16, .4, .17, BLACK, 0, s);
    put(side * .02, my, mz, .2, .27, .21, PLATE, 0, s);
    put(side * .125, my, mz, .015, .2, .05, GLOW, 3, s);
    put(0, hy, hz, .16, .15, .16, BLACK, 0, s);
    const hand = around(0, hy, hz);
    if (side < 0) handL = hand; else handR = hand;
  }
  box(-.46, 1.7 - c, 0, .3, .15, .38, PLATE);
  box(-.52, 1.6 - c, 0, .2, .13, .34, DARKSTEEL);
  box(-.52, 1.79 - c, 0, .12, .07, .28, BLUE);

  const hand = world(...handR), grip = world(...handL), upper = tw;
  tw = 0;
  // split coat tails that lift with speed
  for (const side of [-1, 1]) {
    const a = pose.tail + Math.sin(time * 11 + side) * .13 * flow;
    const mid = bone(side * .17, 1.02 - c, -.18, a, .38, .27, .045, NAVY);
    const end = bone(mid[0] + side * .03, mid[1], mid[2], a + .22 * flow + .05, .4, .24, .04, NAVY);
    box(end[0], end[1], end[2], .25, .05, .055, BLUE, 0, a);
  }

  if (!thrownOut) {   // in hand, angled out from the body so the blade reads from behind
    const busy = P.act || P.cross || P.storm || P.spin || P.punch > 0;
    const yw = P.yaw + upper + pose.swR + (busy ? 0 : .8);
    butt = drawSickle(hand, yw, pose.aR + pose.eR * .5 + lean + pose.wrist, 1.2, roll);
  }
  const sway = Math.sin(time * 3) * .06 - clamp(P.vy * .006, -.2, .2);
  rest = [grip[0] - P.vx * .006 + sway * cy, grip[1] - .42, grip[2] - P.vz * .006 - sway * sy];
  return { hand, grip };
}

// grip point h, heading yw, tilt A (positive = blade end down), scale K; returns the pommel
function drawSickle(h, yw, A, K, roll = 0) {
  const ca = Math.cos(A), sa = Math.sin(A);
  const at = (y, z) => {
    const forward = (y * sa + z * ca) * K;
    const up = (y * ca - z * sa) * K, side = -up * Math.sin(roll);
    return [h[0] + forward * Math.sin(yw) + side * Math.cos(yw), h[1] + up * Math.cos(roll), h[2] + forward * Math.cos(yw) - side * Math.sin(yw)];
  };
  const part = (y, z, w, ht, d, col, own = 0, m = 0) => { const q = at(y, z); push(q[0], q[1], q[2], m, w * K, ht * K, d * K, yw, col, own + A, roll); };
  part(0, .02, .1, .1, .42, BLACK);                 // grip
  part(0, .45, .11, .11, .46, BLUE);                // lacquered shaft
  part(0, .22, .13, .13, .05, STEEL);
  part(0, .69, .13, .13, .05, STEEL);
  part(0, -.22, .13, .13, .07, STEEL);              // pommel, where the chain starts
  part(0, .83, .14, .24, .24, DARKSTEEL);           // head
  part(0, .83, .17, .11, .11, STEEL);               // pivot disc
  part(.06, 1.07, .055, .27, .34, DARKSTEEL, .12);  // curved blade
  part(-.04, 1.34, .05, .24, .3, IRON, .6);
  part(-.24, 1.51, .045, .18, .3, IRON, 1.05);
  part(-.49, 1.58, .035, .1, .28, STEEL, 1.45);
  part(-.07, 1.06, .062, .035, .34, STEEL, .12);    // honed inner edge
  part(-.14, 1.28, .057, .035, .28, STEEL, .6);
  part(-.29, 1.43, .052, .03, .28, STEEL, 1.05);

  return at(0, -.28);
}

// weighted ball gripped by a three-pronged claw; the claw is what catches on walls
function drawBall(p, yaw, pitch = 0) {
  const [x, y, z] = p;
  push(x, y, z, 0, .34, .25, .25, yaw, DARKSTEEL, pitch);
  push(x, y, z, 0, .25, .34, .25, yaw, DARKSTEEL, pitch);
  push(x, y, z, 0, .25, .25, .34, yaw, DARKSTEEL, pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  for (const [ox, oz] of [[.18, 0], [-.1, .15], [-.1, -.15]]) {
    const wx = x + ox * cy + oz * sy, wz = z - ox * sy + oz * cy;
    push(wx, y + .06, wz, 0, .06, .3, .06, yaw, STEEL);
    push(x + (wx - x) * .7, y + .2, z + (wz - z) * .7, 0, .08, .07, .08, yaw, STEEL);
  }
  push(x, y + .25, z, 0, .14, .1, .14, yaw, STEEL);
}

// hollow links (two rails each), every other one turned 90 degrees
function drawLinks(from, to, sag, spacing, wide) {
  const d = [to[0] - from[0], to[1] - from[1], to[2] - from[2]], len = Math.hypot(...d);
  if (len < .05) return;
  const n = Math.min(130, Math.ceil(len / spacing)), seg = len / n;
  let prev = from;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    const next = [from[0] + d[0] * t, from[1] + d[1] * t - Math.sin(Math.PI * t) * sag, from[2] + d[2] * t];
    const e = [next[0] - prev[0], next[1] - prev[1], next[2] - prev[2]], l = Math.hypot(...e) || 1;
    const yaw = Math.atan2(e[0], e[2]), pitch = -Math.asin(clamp(e[1] / l, -1, 1));
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const flat = i & 1, off = flat ? [cy, 0, -sy] : [sp * sy, cp, sp * cy];
    for (const side of [-wide, wide])
      push((prev[0] + next[0]) / 2 + off[0] * side, (prev[1] + next[1]) / 2 + off[1] * side, (prev[2] + next[2]) / 2 + off[2] * side,
           0, wide * .55, wide * .55, l * 1.25, yaw, flat ? STEEL : IRON, pitch);
    prev = next;
  }
}

function drawSlashArc() {
  const k = 1 - P.slashT / .14;
  for (let i = 0; i < 12; i++) {
    const t = i / 11;
    if (P.act?.name === 'chop') {
      if (t > k * 1.5 || t < k * 1.5 - .7) continue;
      const e = 1.9 - t * 2.4, reach = 2.9 * Math.cos(e);
      push(P.x + Math.sin(P.yaw) * reach, P.y + 1.5 + Math.sin(e) * 2.6, P.z + Math.cos(P.yaw) * reach, 3, .08, .1 + .5 * Math.sin(Math.PI * t), .45, P.yaw, GLOW, -e);
      continue;
    }
    const a = P.yaw + (t - .5) * 2.2 * P.slashSide;
    if (t > k * 1.5 || t < k * 1.5 - .7) continue;
    push(P.x + Math.sin(a) * 3, P.y + 1.5 + (.5 - t) * 1.4, P.z + Math.cos(a) * 3, 3,
         .6, .03 + .1 * Math.sin(Math.PI * t), .08, a, GLOW);
  }
}

const MAX_FALL = 6000;
const fallData = new Float32Array(MAX_FALL * 12);
let fallCount = 0;
function buildFallers() {
  fallCount = 0;
  for (const f of fallers) for (const q of f.parts) {
    if (fallCount >= MAX_FALL) return;
    const p = fallerPoint(f, q);
    inst(fallData, 12 * fallCount++, p[0], p[1], p[2], q.mat, V, V, V, f.alongX ? Math.PI / 2 : 0, f.color, f.a * f.sign);
  }
}

function buildDynamic(time) {
  buildScene(time);
  if (!preview) drawRubble(fxDt);
  drawFlames();
}
function buildScene(time) {
  if (!remoteDrawing) dynCount = 0;
  push(0, -1, 0, 2, HALF * BLOCK * 2 + 60, 2, HALF * BLOCK * 2 + 60, 0, [.2,.21,.23]);
  if (preview) {
    drawModel(preview.kind, { x: 0, y: 0, z: 0, yaw: Math.PI + (preview.still ? .35 : Math.sin(time * .7) * .6), vx: 0, vz: 0, vy: 0, phase: 0, grounded: true, state: 'idle', move: 'combo', t: 0, hits: 0 }, time, false);
    return;
  }
  if (who !== 'hero') {
    if (who === 'cinder') drawCinderPlayer(time); else if (who === 'halo') drawHaloPlayer(time); else drawBrutePlayer(time);
    for (const t of thrown) push(t.p[0], t.p[1], t.p[2], 0, 2.6, 2.2, 2.6, t.spin * .7, t.color, t.spin);
    if (P.held?.type === 'rock') push(...holdPoint(), 0, 2.8, 2.3, 2.7, P.yaw, P.held.color);
    drawEnemy(time, drawAlpha); drawEnemyEffects(time); return;
  }
  const c = P.chain, mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const st = P.storm, cf = P.cross;
  const spin = st ? spherePoint(st.a, .7, st.r) : cf ? crossTip(1) : P.spin ? spinTip() : P.orbit ? P.orbit.p : null;
  const thrownOut = !!(spin || c || P.lash || P.reel);
  const { hand, grip } = buildCharacter(time, thrownOut);
  if (thrownOut) {
    let tip;                                    // where the blade is right now
    if (spin) tip = spin;
    else if (c) tip = c.attached ? c.a : mix(hand, c.a, Math.min(1, c.t / c.dur));
    else if (P.lash) tip = lashTip(P.lash);
    else tip = mix(P.reel.from, hand, P.reel.t);
    const d = [tip[0] - hand[0], tip[1] - hand[1], tip[2] - hand[2]], l = Math.hypot(...d) || 1;
    const u = d.map(v => v / l), K = 1.6, head = Math.min(l, 1.15 * K);
    const origin = tip.map((v, i) => v - u[i] * head);       // blade head lands on the target
    butt = drawSickle(origin, Math.atan2(u[0], u[2]), -Math.asin(clamp(u[1], -1, 1)), K);
    if (l > head) drawLinks(hand, butt, P.lash ? .5 : 0, .8, .17);
    drawLinks(hand, grip, .4, .13, .035);       // tail of the chain to the weight
  } else drawLinks(butt, grip, .45, .13, .035);
  // the weight: dangling, slammed downward, or latched to a block
  const w = P.whirl, rb = P.reelBlock;
  let block = null;
  if (rb) block = mix(rb.from, [P.x, P.y + 3.7, P.z], rb.t);
  else if (w) block = whirlPos();
  else if (P.holding) block = [P.x, P.y + 3.7, P.z];
  if (st || cf) {
    const ball = st ? spherePoint(st.a + Math.PI, -.9, st.r) : crossTip(-1);
    drawLinks(grip, ball, 0, .8, .17); drawBall(ball, P.yaw);
  } else if (P.meteor) {
    const ball = mix(grip, P.meteor.to, Math.min(1, P.meteor.t / .09));
    if (ball[1] > P.y) ball[1] = P.y - .5;
    drawLinks(grip, ball, 0, .8, .17); drawBall(ball, P.yaw);
  } else if (block) {
    drawLinks(grip, block, 0, .6, .12);
    const color = rb ? rb.color : P.holding;
    push(block[0], block[1], block[2], 0, 2.6, 2.2, 2.6, w ? w.a : P.yaw, color);
  } else { drawLinks(grip, rest, 0, .13, .035); drawBall(rest, P.yaw); }
  if (P.slashT > 0) drawSlashArc();
  if (cf) for (const side of [1, -1]) for (let i = 1; i < 12; i++) {       // light trails off both ends
    const t = cf.t - i * .012;
    if (t < 0) break;
    const p = crossTip(side, t), q = crossTip(side, t + .012), d = sub(q, p), l = Math.hypot(...d);
    if (l < .15) continue;
    push((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (p[2] + q[2]) / 2, 3, .22 * (1 - i / 12), .22 * (1 - i / 12), l,
         Math.atan2(d[0], d[2]), GLOW, -Math.asin(clamp(d[1] / l, -1, 1)));
  }
  if (st) {                                                    // the sphere itself
    const fade = clamp((SPHERE_TIME - st.t) / .3, 0, 1), c = sphereCentre(), N = 260;
    for (let i = 0; i < N; i++) {                              // evenly spread shell, spinning
      const y = 1 - 2 * (i + .5) / N, ring = Math.sqrt(1 - y * y), a = i * 2.39996 + st.a * .5;
      const py = c[1] + y * st.r;
      if (py > 0) push(c[0] + Math.sin(a) * ring * st.r, py, c[2] + Math.cos(a) * ring * st.r, 3,
                       st.r * .055 * fade, st.r * .012 * fade, st.r * .012 * fade, a + Math.PI / 2, GLOW);
    }
    for (const tilt of [0, 1.05, -1.05]) for (let i = 0; i < 48; i++) {       // three blade orbits
      const a = i / 48 * Math.PI * 2, p = spherePoint(a, tilt, st.r), q = spherePoint(a + .13, tilt, st.r), d = sub(q, p), l = Math.hypot(...d);
      const lit = .35 + .65 * (((a - st.a * (tilt ? 1.4 : 1)) / 6.2832 % 1 + 1) % 1);
      if (p[1] > 0) push((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (p[2] + q[2]) / 2, 3, .45 * lit * fade, .45 * lit * fade, l,
                         Math.atan2(d[0], d[2]), GLOW, -Math.asin(clamp(d[1] / l, -1, 1)));
    }
  }
  if (P.spin) for (let i = 1; i < 16; i++) {               // light trail around the whole turn
    const t = P.spin.t - i * .018;
    if (t < 0) break;
    const p = spinTip(t), q = spinTip(t + .018), d = sub(q, p), l = Math.hypot(...d);
    if (l > .1) push((p[0] + q[0]) / 2, p[1], (p[2] + q[2]) / 2, 3, .3 * (1 - i / 16), .3 * (1 - i / 16), l, Math.atan2(d[0], d[2]), GLOW);
  }
  const wire = P.wire;
  if (wire) {
    drawBall(wire.a, 0);
    if (wire.b) { drawLinks(wire.a, wire.b, 0, Math.max(.9, Math.hypot(...sub(wire.b, wire.a)) / 70), .18); drawBall(wire.b, 0); }
  }
  drawEnemy(time, drawAlpha);
  drawEnemyEffects(time);
  for (const t of thrown) push(t.p[0], t.p[1], t.p[2], 0, 2.6, 2.2, 2.6, t.spin * .7, t.color, t.spin);
}

// ───────────────────────── camera ─────────────────────────
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const norm = a => { const l = Math.hypot(...a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const ubo = new Float32Array(16 + 5 * 4 + 16 * 4);

function updateCamera(dt, time, aspect) {
  const speed = Math.hypot(P.vx, P.vy, P.vz);
  const look = lookDir();
  const ease = k => 1 - Math.exp(-k * dt);
  cam.dip *= Math.exp(-9 * dt);
  cam.low += ((P.h < H ? .85 : 0) - cam.low) * ease(12);
  const strafe = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);

const staticBuf = buf(staticData.byteLength, GPUBufferUsage.VERTEX);
const dynBuf = buf(dynData.byteLength, GPUBufferUsage.VERTEX);
const fallBuf = buf(fallData.byteLength, GPUBufferUsage.VERTEX);
const lifeBuf = buf(lifeData.byteLength, GPUBufferUsage.VERTEX);

const dtBuf = buf(16, GPUBufferUsage.UNIFORM);

const sceneLayout = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: vis, buffer: {} }] });

    layout: device.createPipelineLayout({ bindGroupLayouts: layouts }),

  pipeline(BOX_WGSL, [sceneLayout], { buffers: instLayout }),
  pipeline(SKY_WGSL, [sceneLayout], { depthWrite: false, compare: 'less-equal' }),
  pipeline(DEBRIS_WGSL, [sceneLayout, partLayout]),

const integrated = adapter.info?.vendor === 'intel';

let depth = null, debrisHead = 0, debrisLive = 0;
function resize() {
  const budget = (integrated ? 1.4e6 : 3.7e6) * QUALITY[quality][1];

function flushDebris() {
  const n = debrisQueue.length;
  if (!n) return;
  const data = new Float32Array(debrisQueue.flat());
  const first = Math.min(n, NDEB - debrisHead);
  device.queue.writeBuffer(partBuf, debrisHead * 48, data, 0, first * 12);
  if (n > first) device.queue.writeBuffer(partBuf, 0, data, first * 12, (n - first) * 12);
  debrisHead = (debrisHead + n) % NDEB;

  debrisQueue.length = 0;
}

  genCity(); initLife(); resetPlayer(); fallers = []; resetEnemy(); history = []; popup.t = 0; hitStop = 0; craters.fill(0); thrown.length = 0; debrisQueue.length = 0;
  device.queue.writeBuffer(partBuf, 0, new Float32Array(NDEB * 12));

}

function render(dt, time, alpha = 1) {
  fxDt = dt;
  drawAlpha = alpha;

  meshAge += dt;

  const real = [P.x, P.y, P.z];
  P.x = P.px + (real[0] - P.px) * alpha; P.y = P.py + (real[1] - P.py) * alpha; P.z = P.pz + (real[2] - P.pz) * alpha;

  if (preview) lifeCount = fallCount = 0; else buildLife();

  [P.x, P.y, P.z] = real;
  flushDebris();
  device.queue.writeBuffer(dynBuf, 0, dynData, 0, dynCount * 12);
  if (fallCount) device.queue.writeBuffer(fallBuf, 0, fallData, 0, fallCount * 12);
  if (lifeCount) device.queue.writeBuffer(lifeBuf, 0, lifeData, 0, lifeCount * 12);
  device.queue.writeBuffer(uniformBuf, 0, ubo);
  device.queue.writeBuffer(dtBuf, 0, new Float32Array([dt, 0, 0, 0]));

  const enc = device.createCommandEncoder();

    c.setPipeline(simPipe); c.setBindGroup(0, simBind); c.dispatchWorkgroups(NDEB / 64);
    c.end();

    colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store' }],
    depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'discard' },
  });
  pass.setBindGroup(0, sceneBind);
  pass.setPipeline(boxPipe);
  pass.setVertexBuffer(0, staticBuf); pass.draw(18, staticCount);              // buildings
  if (fallCount) { pass.setVertexBuffer(0, fallBuf); pass.draw(18, fallCount); }
  if (lifeCount) { pass.setVertexBuffer(0, lifeBuf); pass.draw(18, lifeCount); }
  pass.setVertexBuffer(0, dynBuf);    pass.draw(18, dynCount - 1, 0, 1);      // character, thrown chunks
  if (simulate) { pass.setPipeline(debrisPipe); pass.setBindGroup(1, partBind); pass.draw(18, NDEB); pass.setPipeline(boxPipe); }
  pass.draw(18, 1, 0, 0);                                                     // ground last: mostly hidden

}

// ───────────────────────── events + loop ─────────────────────────
const locked = () => document.pointerLockElement === canvas;
// ───────────────────────── online 1v1 (WebRTC, peer to peer) ─────────────────────────
const PROTO = 1;
const PEER_LIB = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';   // only loaded when you go online
const LOCAL_NET = new URLSearchParams(location.search).get('net') === 'local';   // two tabs on one computer, for testing
// the parts of a fighter the other side needs in order to draw them
const SHARED = ['x', 'y', 'z', 'vx', 'vy', 'vz', 'yaw', 'phase', 'grounded', 'h', 'wall', 'charge', 'glide', 'dive', 'dash', 'slide', 'mantle', 'kick', 'meteor', 'orbit',
  'chain', 'storm', 'cross', 'guill', 'whirl', 'act', 'punch', 'slashT', 'slashSide', 'carving', 'holding', 'lash', 'reel', 'spin', 'cm', 'leapCharge', 'leaping', 'flying', 'beam', 'wire', 'reelBlock', 'hurtT', 'style', 'hp'];
let link = null, netStatus = '', joinCode = '';
function setStatus(text) { netStatus = text; const el = $('netstatus'); if (el) el.textContent = text; }
const netSend = msg => { try { link?.send(msg); } catch {} };

const loadScript = src => new Promise((ok, no) => {
  if (window.Peer) return ok();
  const tag = document.createElement('script');
  tag.src = src; tag.onload = ok; tag.onerror = () => no(new Error('could not download the networking library'));
  document.head.appendChild(tag);
});
const randomCode = () => Array.from(crypto.getRandomValues(new Uint8Array(5)), b => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[b % 31]).join('');

// a link is { send(msg), close() }; it calls linkUp / onNet / linkDown
function localLink(code, hosting) {
  const ch = new BroadcastChannel('skybreak-' + code), me = hosting ? 'h' : 'g';
  let up = false;
  const api = { send: msg => ch.postMessage({ from: me, msg }), close: () => ch.close(), kind: 'same computer' };
  ch.onmessage = e => {
    const { from, msg } = e.data;
    if (from === me) return;
    if (msg.t === 'knock-knock') { if (!up) { up = true; api.send({ t: 'knock-knock' }); linkUp(api, hosting); } return; }
    onNet(msg);
  };
  if (!hosting) api.send({ t: 'knock-knock' });
  setStatus(hosting ? 'Waiting for your friend. Room code: ' + code : 'Looking for room ' + code + '…');
}
async function peerLink(code, hosting) {
  setStatus('Step 1 of 4: downloading the networking library…');
  await loadScript(PEER_LIB);
  setStatus('Step 2 of 4: reaching the matchmaking server…');
  const peer = new window.Peer(hosting ? 'skybreak-' + code : undefined);   // library defaults: STUN, plus relays if direct fails
  let conn = null, giveUp = 0;
  const wire = c => {
    conn = c;
    setStatus('Step 4 of 4: opening a direct connection…');
    giveUp = setTimeout(() => setStatus('Step 4 failed: neither a direct connection nor the relay got through. A VPN or a strict work or school network is probably blocking it.'), 20000);
    c.on('open', () => {
      clearTimeout(giveUp);
      linkUp({ send: m => c.open && c.send(m), close: () => peer.destroy(), kind: 'peer to peer', pc: c.peerConnection }, hosting);
    });
    c.on('data', onNet);
    c.on('close', () => linkDown('The other player left.'));
    c.on('error', e => linkDown('Connection error: ' + e.type));
  };
  peer.on('open', () => {
    if (hosting) { setStatus('Step 3 of 4: waiting for your friend. Room code: ' + code); peer.on('connection', c => { if (!conn) wire(c); else c.close(); }); }
    else { setStatus('Step 3 of 4: looking for room ' + code + '…'); wire(peer.connect('skybreak-' + code, { reliable: true, serialization: 'json' })); }
  });
  peer.on('error', e => {
    clearTimeout(giveUp);
    const why = { 'peer-unavailable': 'No room with that code. Check it, and make sure the host is still waiting.', network: 'Lost contact with the matchmaking server.',
      'server-error': 'The matchmaking server is not responding.', 'unavailable-id': 'That room code is already in use. Host again.', 'browser-incompatible': 'This browser does not support WebRTC.' }[e.type] || e.type;
    setStatus('Could not connect: ' + why);
  });
  link = { send() {}, close: () => { clearTimeout(giveUp); peer.destroy(); } };   // lets Back cancel
}
function openRoom(hosting, code) {
  netClose();
  code = (code || randomCode()).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  if (!code) return setStatus('Type the room code first.');
  if (LOCAL_NET) localLink(code, hosting);
  else peerLink(code, hosting).catch(e => setStatus('Could not connect: ' + e.message));
}
function netClose() {
  netSend({ t: 'bye' });
  link?.close(); link = null; pvp = null;
}
function linkDown(why) {
  if (!link) return;
  link = null;
  const playing = !!pvp;
  pvp = null; applySettings();
  if (playing) { toMain(); notice = why; show('main'); } else setStatus(why);
}
function linkUp(api, hosting) {
  link = api;
  setStatus('Connected. Starting…');
  netSend({ t: 'hello', v: PROTO, kind: pickWho, hosting });
}

function startPvp(theirKind, hosting) {
  pvp = { hosting, carves: [], pin: null, state: null, at: 0, ping: 0, mine: 0, theirs: 0, downAt: 0, pose: null, sent: 0 };
  applySettings(); pvp.pose = Object.assign({}, pose);
  setMatch(pickWho, theirKind);
  pvpSpawn();
  resume();
  say(ROSTER[who].name + '  vs  ' + ROSTER[foe].name + '  (online)', 2.4);
}
function pvpSpawn() {
  const z = pvp.hosting ? 0 : 36, yaw = pvp.hosting ? 0 : Math.PI;
  Object.assign(P, { x: 0, y: 0, z, px: 0, py: 0, pz: z, vx: 0, vy: 0, vz: 0, yaw, hp: 100, iframe: 2, style: 0, flying: false, held: null, holding: null, chain: null, cm: null });
  cam.yaw = yaw; pvp.pin = null;
  Object.assign(E, { x: 0, y: 0, z: 36 - z, px: 0, py: 0, pz: 36 - z, dead: false, awake: true, state: 'idle', hp: E.max });
}
function pvpDown() {
  pvp.theirs++; netSend({ t: 'down' });
  say('YOU FELL  ·  ' + pvp.mine + ' - ' + pvp.theirs, 2.5);
  pvpSpawn();
}

// everything arriving is from someone else's computer, so check it before using it
const num = (v, lo, hi, d = 0) => Number.isFinite(v) ? clamp(v, lo, hi) : d;
function onNet(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hello') {
    if (m.v !== PROTO) return setStatus('The two of you are running different versions. Both refresh the page.');
    if (!ROSTER[m.kind] || pvp) return;
    return startPvp(m.kind, !m.hosting);
  }
  if (m.t === 'bye') return linkDown('The other player left.');
  if (!pvp) return;
  if (m.t === 'state' && m.s && typeof m.s === 'object') {
    pvp.state = m; pvp.at = performance.now();
    if (Array.isArray(m.c)) for (const c of m.c.slice(0, 60)) {
      remoteCarve = byEnemy = true;
      carve(num(c[0], -400, 400), num(c[1], -5, 300), num(c[2], -400, 400), num(c[3], 0, 30), num(c[4], -50, 60));
      remoteCarve = byEnemy = false;
    }
    // are they holding on to me?
    const g = m.g;
    const was = pvp.pin;
    pvp.pin = g ? { x: num(g.x, -400, 400), y: num(g.y, 0, 300), z: num(g.z, -400, 400), swing: num(g.swing, -3, 3) } : null;
    if (was && !pvp.pin) { P.vy = 14; P.iframe = Math.max(P.iframe, .3); }
  } else if (m.t === 'hit') {
    // the attacker's strength against my toughness, as a share of my health bar
    const loss = num(m.d, 0, 220) * ROSTER[who].armor * 400 / (ROSTER[who].netHp || ROSTER[who].hp);
    if (pvp.pin) P.iframe = 0;                              // no dodging while they have hold of me
    rawDamage = true;
    if (hurtPlayer(loss, num(m.x, -400, 400), num(m.z, -400, 400), 14) && pvp) P.iframe = Math.min(P.iframe, .22);   // fast combos still land
    rawDamage = false;
  } else if (m.t === 'stun') { P.stunT = num(m.d, 0, 1); say('STUNNED', .7); }
  else if (m.t === 'crush') {                                // a tower came down on me
    P.iframe = 0; rawDamage = true; hurtPlayer(35, num(m.x, -400, 400), num(m.z, -400, 400), 24); rawDamage = false;
  }
  else if (m.t === 'knock') {
    P.vx = num(m.x, -90, 90); P.vy = num(m.y, -20, 60); P.vz = num(m.z, -90, 90); P.grounded = false; P.flying = false;
  } else if (m.t === 'down') { pvp.mine++; say('YOU WIN THE ROUND  ·  ' + pvp.mine + ' - ' + pvp.theirs, 2.5); pvpSpawn(); }
  else if (m.t === 'slide') landslide(num(m.x, -400, 400), num(m.y, 0, 300), num(m.z, -400, 400), num(m.yaw, -10, 10), false, true);
  else if (m.t === 'topple') {
    const b = buildings[m.i | 0];
    if (b) {
      dropTower(b, num(m.cut, 0, b.ny - 1) | 0, !!m.alongX, m.sign > 0 ? 1 : -1, true);
      say('TOWER FALLING!', 1.6); sfx(1, 300, 1.2);
    }
  }
  else if (m.t === 'ping') netSend({ t: 'pong', at: m.at });
  else if (m.t === 'pong') pvp.ping = performance.now() - m.at | 0;
}

// 30 times a second: who I am right now
let pingAt = 0;
function netTick() {
  if (!pvp || !link) return;
  const st = {};
  for (const k of SHARED) st[k] = P[k];
  st.held = P.held ? { type: P.held.type, color: P.held.color } : null;
  const gripping = P.held?.type === 'rival' || P.cm?.carry || P.chain?.pulling && P.chain.ent?.type === 'rival';
  const shots = waves.filter(w => w.mine).slice(0, 8).map(w => ({ p: w.p, v: w.v, yaw: w.yaw, kind: w.kind, life: w.life, age: w.age }));
  const blocks = thrown.slice(0, 4).map(t => ({ p: t.p, color: t.color, spin: t.spin }));
  netSend({ t: 'state', s: JSON.parse(JSON.stringify(st, (k, v) => k === 'ent' || k === 'o' ? undefined : typeof v === 'number' ? Math.round(v * 100) / 100 : v)),
    c: pvp.carves.splice(0), r: rain.filter(d => d.mine).slice(0, 30).map(d => ({ x: d.x, y: d.y, z: d.z, floor: d.floor, delay: d.delay })), w: shots, b: blocks, g: gripping ? { x: E.x, y: E.y, z: E.z, swing: E.swing || 0 } : null });
  // knockbacks I dealt this tick
  if (E.stun > 0 && !gripping) { netSend({ t: 'knock', x: E.vx, y: E.vy, z: E.vz }); E.stun = 0; E.flung = false; }
  if (performance.now() - pingAt > 1000) { pingAt = performance.now(); netSend({ t: 'ping', at: pingAt }); }
}
setInterval(netTick, 33);

// the rival's body follows what they last told me, smoothed between messages
function remoteStep(dt) {
  const m = pvp.state;
  E.awake = true; E.dead = false; E.state = 'idle'; E.poise = 0; E.guard = 0;
  if (!m) return;
  E.hp = E.max * num(m.s.hp, 0, 100, 100) / 100;
  const held = P.held?.type === 'rival' || P.cm?.carry || P.chain?.pulling;
  if (held || E.stun > 0) return;                           // I am moving them; netTick reports it
  const age = Math.min(.15, (performance.now() - pvp.at) / 1000), k = Math.min(1, dt * 18);
  for (const [a, v] of [['x', 'vx'], ['y', 'vy'], ['z', 'vz']]) {
    const target = num(m.s[a], -400, 400) + num(m.s[v], -130, 130) * age * (a === 'y' && m.s.grounded ? 0 : 1);
    E[a] += (target - E[a]) * (Math.abs(target - E[a]) > 15 ? 1 : k);
  }
  E.yaw = num(m.s.yaw, -1e4, 1e4); E.vx = num(m.s.vx, -130, 130); E.vy = num(m.s.vy, -130, 130); E.vz = num(m.s.vz, -130, 130); E.swing = 0;
}

// borrow my own drawing code: briefly become them, draw, then switch back
function drawRemote(time) {
  if (pvp.pin) tumble(1, { x: P.x, y: P.y, z: P.z, yaw: P.yaw }, pvp.pin.swing);   // I am being swung about
  const m = pvp.state;
  if (!m) return;
  const saved = Object.assign({}, P), mine = { who, pose, butt, rest, tint }, first = dynCount;
  try {
    Object.assign(P, heroBlank, m.s, { x: E.x, y: E.y, z: E.z, held: m.s.held || null });
    if (m.s.chain && !Array.isArray(m.s.chain.a)) P.chain = null;
    who = foe; pose = pvp.pose; tint = foe === mine.who; remoteDrawing = true;
    buildScene(time);
    if (P.held && P.held.type !== 'rival') push(E.x, E.y + (foe === 'halo' ? 3.7 : 5.6), E.z, 0, 2.4, P.held.type === 'car' ? 1.2 : 1.8, 2.4, E.yaw, P.held.color || [.5, .2, .2]);
  } catch (e) { console.warn('could not draw the other player', e); }
  remoteDrawing = false;
  ({ who, pose, butt, rest, tint } = mine);
  Object.assign(P, saved);
  if (m.g === null && E.swing) E.swing = 0;
  // their projectiles, drawn alongside mine
  const own = waves, ownRain = rain;
  try {
    waves = own.concat((m.w || []).slice(0, 8).filter(w => Array.isArray(w.p) && Array.isArray(w.v)).map(w => ({ ...w, mine: false })));
    rain = ownRain.concat((m.r || []).slice(0, 30).filter(d => Number.isFinite(d.x) && Number.isFinite(d.y)).map(d => ({ ...d, mine: false })));
    drawEnemyEffects(time);
    for (const b of (m.b || []).slice(0, 4)) push(b.p[0], b.p[1], b.p[2], 0, 2.6, 2.2, 2.6, b.spin * .7, b.color, b.spin);
  } catch (e) { console.warn(e); }
  waves = own; rain = ownRain;
}

// actions are what the game asks about; bindings say which physical input drives each
const ACTIONS = [['KeyW', 'Move forward'], ['KeyS', 'Move back'], ['KeyA', 'Move left'], ['KeyD', 'Move right'], ['ShiftLeft', 'Sprint'], ['Space', 'Jump'],
  ['KeyC', 'Slide / crouch'], ['KeyE', 'Dash'], ['mouse0', 'Attack'], ['mouse2', 'Mobility skill'], ['KeyR', 'Reel in (chain)'], ['KeyF', 'Slam'], ['KeyG', 'Ranged / grab'],
  ['KeyT', 'Skill 1'], ['KeyZ', 'Skill 2'], ['KeyX', 'Skill 3'], ['KeyQ', 'Ultimate']];
const defaultBinds = () => Object.fromEntries(ACTIONS.map(([id]) => [id, id]));
const SET_KEY = 'skybreak.settings', SAVE_KEY = 'skybreak.save';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
const saved0 = store.get(SET_KEY) || {};
const settings = { quality: 0, cap60: true, volume: 1, fullscreen: true, debug: false, slow: 1, help: true, ...saved0, binds: { ...defaultBinds(), ...saved0.binds } };
function applySettings() {
  quality = clamp(settings.quality | 0, 0, QUALITY.length - 1); cap60 = !!settings.cap60;
  debug = !!settings.debug && !pvp; timeScale = debug ? settings.slow : 1;
  store.set(SET_KEY, settings);
}
const KEY_NAMES = { mouse0: 'Left click', mouse1: 'Middle click', mouse2: 'Right click', mouse3: 'Mouse 4', mouse4: 'Mouse 5', Space: 'Space',
  ShiftLeft: 'L Shift', ShiftRight: 'R Shift', ControlLeft: 'L Ctrl', ControlRight: 'R Ctrl', AltLeft: 'L Alt', AltRight: 'R Alt' };
const keyName = code => KEY_NAMES[code] || code.replace(/^Key|^Digit/, '').replace(/^Numpad/, 'Num ').replace(/^Arrow/, '');
const bound = action => keyName(settings.binds[action]);

let mode = 'menu', screen = 'main', pickWho = 'hero', pickFoe = 'cinder', rebinding = null, optionsFrom = 'main', notice = '', swallowClick = false;
const thumbs = {};

function helpHTML() {
  const line = (k, t) => k.padEnd(13) + t + '\n';
  let h = '<b>' + ROSTER[who].name + '</b>   Esc: pause\n';
  h += line(['KeyW', 'KeyA', 'KeyS', 'KeyD'].map(bound).join(' '), 'move');
  for (const a of ['ShiftLeft', 'Space', 'KeyC', 'KeyE']) h += line(bound(a), (who === 'halo' ? { ShiftLeft: 'boost', Space: 'fly / rise', KeyC: 'descend / land', KeyE: 'dash' } : { ShiftLeft: 'sprint', Space: 'jump / glide', KeyC: 'slide', KeyE: 'dash' })[a]);
  h += '\n';
  for (const [a, name] of ROSTER[who].moves) h += line(bound(a), name);
  return h;
}

// ── screens ──
const btn = (label, act, extra = '') => `<button class="wide ${extra}" data-act="${act}">${label}</button>`;
function selectScreen(which) {
  const pick = which === 'who' ? pickWho : pickFoe, r = ROSTER[pick];
  const cards = Object.keys(ROSTER).map(k => `<button class="card ${k === pick ? 'sel' : ''}" data-act="card" data-id="${k}"><img alt="" src="${thumbs[k] || ''}">${ROSTER[k].name}</button>`).join('');
  const stats = ['Power', 'Speed', 'Reach', 'Toughness'].map((n, i) => `<div class="stat"><span>${n}</span>${[1, 2, 3, 4, 5].map(v => `<i class="${v <= r.stats[i] ? 'on' : ''}"></i>`).join('')}</div>`).join('');
  const moves = r.moves.map(([a, name, what]) => `<div class="mv"><b>${bound(a)}</b><div>${name}<small>${what}</small></div></div>`).join('');
  return `<div class="pane left"><h2>${which === 'who' ? 'CHOOSE YOUR FIGHTER' : 'CHOOSE YOUR RIVAL'}</h2>
    <p class="sub">${which === 'who' ? 'Step 1 of 2' : 'Step 2 of 2 · you are ' + ROSTER[pickWho].name + (pick === pickWho ? ' · mirror match' : '')}</p>
    <div class="grid">${cards}</div>${btn(which === 'who' ? (online ? 'Go online ▸' : 'Confirm fighter ▸') : 'Start match ▸', which === 'who' ? 'toFoe' : 'start', 'go')}${btn('◂ Back', 'back')}</div>
    <div class="pane right"><h2>${r.name}</h2><p class="sub">${r.role}</p><p>${r.desc}</p>${stats}<h2 style="margin-top:16px">MOVES</h2>${moves}</div>`;
}
let online = false;

    <p id="netstatus" style="min-height:3em;color:#ffd25a">${netStatus}</p>

    ${btn('◂ Back', 'back')}</div>`,
  main() {
    const sv = store.get(SAVE_KEY);

      ${btn('Options', 'options')}${btn('Exit', 'exit')}<p class="sub">${notice}${integrated ? '<br>Running on the integrated GPU. Set your browser to High performance in Windows graphics settings for smoother play.' : ''}</p></div>`;

    ${btn('Back to the fight', 'resume', 'go')}${btn('Options', 'options')}${btn('Leave match', 'main')}</div>` : `<div class="pane center"><h2>PAUSED</h2><p class="sub">${ROSTER[who].name} vs ${foeName()}${notice ? ' · ' + notice : ''}</p>
    ${btn('Resume', 'resume', 'go')}${btn('Save game', 'save')}${btn('Rematch (rival returns in front of you)', 'rematch')}${btn('Rebuild city', 'rebuild')}${btn('Options', 'options')}${btn('Main menu', 'main')}</div>`,
  options() {
    const row = (label, ctl) => `<div class="row"><span>${label}</span>${ctl}</div>`;
    const tog = (key, label) => row(label, `<button data-act="toggle" data-id="${key}">${settings[key] ? 'On' : 'Off'}</button>`);
    return `<div class="pane center"><h2>OPTIONS</h2>
      ${row('Graphics quality', `<button data-act="quality">${QUALITY[settings.quality][0]}</button>`)}${tog('cap60', 'Steady 60 fps cap')}
      ${row('Sound volume', `<button data-act="volume">${Math.round(settings.volume * 100)}%</button>`)}${tog('help', 'On-screen controls list')}
      ${tog('fullscreen', 'Fullscreen, block browser shortcuts')}${tog('debug', 'Debug mode (no damage, full style)')}
      ${row('Debug slow motion', `<button data-act="slow" ${settings.debug ? '' : 'disabled'}>x${settings.slow}</button>`)}
      <p class="sub">Outside fullscreen the browser keeps shortcuts such as Ctrl+W. Avoid binding Ctrl there.</p>
      ${btn('Key bindings ▸', 'keys')}${btn('◂ Back', 'back')}</div>`;
  },
  keys: () => `<div class="pane center"><h2>KEY BINDINGS</h2><p class="sub">${rebinding ? 'Press a key or mouse button. Esc cancels.' : 'Click an action to change it. Taken inputs swap. Esc is always pause.'}</p>
    ${ACTIONS.map(([id, label]) => `<div class="row"><span>${label}</span><button data-act="bind" data-id="${id}">${rebinding === id ? '…' : bound(id)}</button></div>`).join('')}
    ${btn('Reset to defaults', 'resetKeys')}${btn('◂ Back', 'back')}</div>`,
  exit: () => `<div class="pane center"><h2>GOODBYE</h2><p>Your browser does not let a page close a tab you opened yourself. You can close this tab now.</p>${btn('◂ Back to the menu', 'main')}</div>`,
};
function show(name) {
  screen = name;
  const menu = $('menu'), keep = menu.querySelector('.pane')?.scrollTop;
  menu.innerHTML = name ? SCREENS[name]() : '';
  if (name === 'keys' && keep) menu.querySelector('.pane').scrollTop = keep;
  document.body.classList.toggle('inmenu', mode === 'menu');
  // which fighter stands behind this screen
  preview = mode !== 'menu' ? null : name === 'who' ? { kind: pickWho, ndc: -.08 } : name === 'foe' ? { kind: pickFoe, ndc: -.08 } : { kind: pickWho, ndc: .4 };
}

// ── matches ──
function setMatch(a, b) {
  who = a; foe = b; preview = null;
  resetWorld(); waves = []; rain = [];
  $('help').innerHTML = helpHTML();
}
function pause() {
  if (mode !== 'play') return;
  mode = 'pause'; notice = ''; cam.shake = 0; rumble = 0;
  keys.clear(); pressed.clear(); released.clear(); P.charge = -1;
  if (locked()) document.exitPointerLock();
  show('pause');
}
function capture() {
  if (settings.fullscreen && !document.fullscreenElement)
    document.documentElement.requestFullscreen?.().then(() => navigator.keyboard?.lock?.()).catch(() => {});
  const req = canvas.requestPointerLock({ unadjustedMovement: true });
  req?.catch(() => canvas.requestPointerLock()?.catch?.(() => {}));
}
function resume() {
  mode = 'play'; show(null);
  $('help').innerHTML = helpHTML(); $('help').style.display = settings.help ? '' : 'none';
  $('msg').style.display = locked() ? 'none' : 'block';
  initAudio(); capture();
}
function toMain() {
  mode = 'menu'; notice = '';
  if (pvp || link) { netClose(); applySettings(); }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  resetWorld(); show('main');
}
function startMatch(a, b) {
  setMatch(a, b); resume();
  say(ROSTER[who].name + '  vs  ' + foeName(), 2.4);
}

// ── save / load ──
const pack = a => { const out = []; for (const v of a) { const x = v === 1 ? 1 : 0; if (out.length && out[out.length - 2] === x) out[out.length - 1]++; else out.push(x, 1); } return out; };
function saveGame() {
  const city = [];
  buildings.forEach((b, i) => { if (b.vox) city.push([i, pack(b.vox)]); });
  return store.set(SAVE_KEY, { v: 1, who, foe, when: new Date().toLocaleString(), P: [P.x, P.y, P.z, P.hp, P.style, cam.yaw],
    E: [E.x, E.y, E.z, E.hp, E.awake, E.dead, E.enraged], city });
}
function loadGame() {
  const d = store.get(SAVE_KEY);
  if (!d || d.v !== 1 || !ROSTER[d.who] || !ROSTER[d.foe]) return false;
  setMatch(d.who, d.foe);
  for (const [i, runs] of d.city) {
    const b = buildings[i];
    if (!b) continue;
    b.vox = new Uint8Array(b.nx * b.ny * b.nz);
    let o = 0;
    for (let k = 0; k < runs.length; k += 2) { b.vox.fill(runs[k], o, o + runs[k + 1]); o += runs[k + 1]; }
    b.dirty = true;
  }
  cityDirty = true;
  const [x, y, z, hp, st, yaw] = d.P;
  Object.assign(P, { x, y, z, px: x, py: y, pz: z, hp, style: st, grounded: false }); cam.yaw = yaw;
  const [ex, ey, ez, ehp, awake, dead, enraged] = d.E;
  Object.assign(E, { x: ex, y: ey, z: ez, px: ex, py: ey, pz: ez, hp: ehp, awake, dead, enraged });
  return true;
}

// ── menu clicks ──
const ACT = {
  new() { online = false; pickWho = 'hero'; show('who'); },
  multi() { online = true; netStatus = ''; show('who'); },
  host() { openRoom(true); },
  join() { joinCode = $('code').value; openRoom(false, joinCode); },
  card(id) { if (screen === 'who') pickWho = id; else pickFoe = id; show(screen); },
  toFoe() { if (online) return show('mp'); if (pickFoe === pickWho) pickFoe = Object.keys(ROSTER).find(k => k !== pickWho); show('foe'); },
  start() { startMatch(pickWho, pickFoe); },
  load() { if (loadGame()) resume(); else { notice = 'That save could not be read.'; show('main'); } },
  options() { optionsFrom = screen; show('options'); },
  exit() { applySettings(); window.close(); show('exit'); },
  keys() { show('keys'); },
  back() {
    rebinding = null;
    if (screen === 'keys') show('options');
    else if (screen === 'options') show(optionsFrom);
    else if (screen === 'foe') show('who');
    else if (screen === 'mp') { netClose(); show('who'); }
    else show('main');
  },
  resume, main: toMain,
  save() { notice = saveGame() ? 'Game saved' : 'Could not save (browser storage unavailable)'; show('pause'); },
  rematch() {
    resetEnemy();
    const x = P.x + Math.sin(cam.yaw) * 18, z = P.z + Math.cos(cam.yaw) * 18;
    Object.assign(E, { x, z, y: P.y, px: x, pz: z, py: P.y, awake: true, cd: 1.4 }); P.hp = 100; resume();
  },
  rebuild() { resetWorld(); resume(); },
  toggle(id) { settings[id] = !settings[id]; applySettings(); show('options'); },
  quality() { settings.quality = (settings.quality + 1) % QUALITY.length; applySettings(); show('options'); },
  volume() { settings.volume = settings.volume >= 1 ? 0 : settings.volume + .25; applySettings(); show('options'); },
  slow() { settings.slow = settings.slow === 1 ? .3 : settings.slow === .3 ? .08 : 1; applySettings(); show('options'); },
  bind(id) { rebinding = id; show('keys'); },
  resetKeys() { settings.binds = defaultBinds(); rebinding = null; applySettings(); show('keys'); },
};
$('menu').addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; return; }
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { initAudio(); ACT[b.dataset.act](b.dataset.id); }
});
function rebind(code) {
  if (code !== 'Escape') {
    const other = ACTIONS.find(([id]) => settings.binds[id] === code)?.[0];
    if (other) settings.binds[other] = settings.binds[rebinding];     // swap, so nothing is left unbound
    settings.binds[rebinding] = code;
    applySettings();
  }
  rebinding = null; show('keys');
}

// ── input ──
const actionsFor = code => ACTIONS.filter(([id]) => settings.binds[id] === code).map(([id]) => id);
addEventListener('keydown', e => {
  if (rebinding) { e.preventDefault(); rebind(e.code); return; }
  if (mode === 'play') {
    e.preventDefault();                                     // nothing pressed in a match reaches the browser
    if (e.code === 'Escape') pause();
    else if (!e.repeat) actionsFor(e.code).forEach(press);
  } else if (e.code === 'Escape') {
    if (mode === 'pause' && screen === 'pause') return;
    if (screen !== 'main') ACT.back();
  }
});
addEventListener('keyup', e => { if (mode === 'play') { e.preventDefault(); actionsFor(e.code).forEach(release); } });
addEventListener('mousedown', e => {
  if (rebinding) { e.preventDefault(); swallowClick = e.button === 0; rebind('mouse' + e.button); return; }
  if (mode !== 'play') return;
  e.preventDefault();
  if (!locked()) { initAudio(); capture(); return; }
  actionsFor('mouse' + e.button).forEach(press);
}, true);
addEventListener('mouseup', e => { if (e.button > 2) e.preventDefault(); if (mode === 'play') actionsFor('mouse' + e.button).forEach(release); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (!locked() || mode !== 'play') return;
  cam.turnTo = undefined;
  cam.yaw -= e.movementX * .0024;
  cam.pitch = clamp(cam.pitch - e.movementY * .0022, -1.35, 1.25);
});
addEventListener('blur', () => { keys.clear(); pressed.clear(); released.clear(); pause(); });
addEventListener('beforeunload', e => { if (mode !== 'menu') { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('pointerlockchange', () => {
  $('msg').style.display = locked() ? 'none' : 'block';
  if (!locked()) pause();
});

applySettings();
resetWorld();
// card thumbnails are photographs of the real models
{
  const shot = document.createElement('canvas'); shot.width = 150; shot.height = 190;
  const g = shot.getContext('2d');
  for (const kind of Object.keys(ROSTER)) {
    preview = { kind, ndc: 0, still: true };
    for (let i = 0; i < 12; i++) render(0, 1 + i * .05);
    const h = canvas.height * .82, w = h * 150 / 190;
    g.drawImage(canvas, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h, 0, 0, 150, 190);
    thumbs[kind] = shot.toDataURL('image/jpeg', .85);
  }
}
show('main');
window.started = true;
let last = performance.now(), acc = 0, time = 0, frames = 0, statT = 0;
let due = 0, aimT = 0;
function frame(now) {
  if (cap60) {
    if (now < due - 3) { requestAnimationFrame(frame); return; }
    due = Math.max(due + 1000 / 60, now);
  }
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000));
  last = now; acc += (hitStop > 0 ? .12 : 1) * dt * timeScale; hitStop -= dt;   // brief freeze sells heavy hits
  time += dt * timeScale; frames++; statT += dt;
  const playing = pvp ? mode !== 'menu' : mode === 'play' && locked();
  fighting = playing;
  if (playing) {
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    updateCollapse(dt * timeScale);
    updateLife(dt * timeScale);
  } else acc = 0;
  if ((aimT += dt) > .1) {
    aimT = 0;
    const look = lookDir(), ok = raycast(aimOrigin(look), look, RANGE);
    $('cross').style.cssText = ok ? 'background:#ffb340;transform:scale(2.2);opacity:1' : '';
  }
  render(playing || mode === 'menu' ? dt : 0, time, playing ? acc / STEP : 1);
  $('style').firstChild.style.width = P.style + '%';
  $('style').className = P.style >= 100 ? 'full' : '';
  $('style').lastChild.textContent = P.style >= 100 ? 'ULT READY · PRESS ' + bound('KeyQ').toUpperCase() : 'ULT ' + Math.floor(P.style) + '%';
  $('pop').textContent = popup.t > 0 ? popup.text : '';
  const away = Math.hypot(E.x - P.x, E.z - P.z);
  $('boss').style.display = E.dead ? 'none' : 'block';
  const tone = foe === who || foe === 'hero' ? '#3fa0ff' : foe === 'brute' ? '#d8523a' : foe === 'halo' ? '#f2c53d' : '#ff5a1f';
  $('boss').style.color = '#ffe0d0';
  $('boss').children[1].firstChild.style.background = tone;
  $('boss').children[0].textContent = (pvp ? 'OPPONENT · ' + ROSTER[foe].name + ' · ' + pvp.mine + '-' + pvp.theirs + ' · ' + pvp.ping + ' ms' : foeName()) + (E.awake ? '' : ' (waiting)') + '  ·  ' + away.toFixed(0) + ' m';
  $('boss').children[1].firstChild.style.width = E.hp / E.max * 100 + '%';
  $('hp').firstChild.style.width = Math.max(0, P.hp) + '%';
  $('hurt').style.opacity = Math.max(0, P.hurtT * 2, P.hp < 30 ? .3 : 0);
  const charge = P.leapCharge > .16 ? clamp((P.leapCharge - .16) / .8, 0, 1) : P.charge;
  $('bar').style.display = charge > .05 ? 'block' : 'none';
  $('bar').firstChild.style.width = (charge * 100) + '%';
  if (statT > .5) {
    const fps = frames / statT;
    $('stats').textContent = `${fps.toFixed(0)} fps${cap60 ? ' (cap 60)' : ''} · ${canvas.width}×${canvas.height}\nGPU: ${gpuName} · ${QUALITY[quality][0]}\n${(staticCount + dynCount + lifeCount).toLocaleString()} boxes\n`
      + `${Math.hypot(P.vx, P.vy, P.vz).toFixed(0)} m/s · alt ${P.y.toFixed(0)} m\ndash ${'◆'.repeat(P.dashes)}${'◇'.repeat(Math.max(0, (ROSTER[who].dashes || 2) - P.dashes))}` + (who === 'brute' ? `\nrush ${P.rushCd > 0 ? Math.ceil(P.rushCd) + 's' : 'ready'}` : '')
      + (debug ? `\n\nDEBUG  style full, endless dash + jump\nspeed x${timeScale}\nanim ${P.act?.name || '-'} · pos ${P.x.toFixed(0)}, ${P.y.toFixed(0)}, ${P.z.toFixed(0)}` : '');
    frames = 0; statT = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const sim60 = () => { fighting = true; for (let i = 0; i < 2; i++) step(STEP); updateCollapse(1 / 60); updateLife(1 / 60); netTick(); };
// console / test hook
window.game = {
  async bench(n = 60) { render(0, 1); await device.queue.onSubmittedWorkDone(); const t = performance.now(); for (let i = 0; i < n; i++) render(0, 1); await device.queue.onSubmittedWorkDone(); return { ms: +((performance.now() - t) / n).toFixed(2), w: canvas.width, h: canvas.height }; },
  P, cam, press, release, step, STEP, carve, updateCollapse, resetWorld, render,
  setDebug(v) { debug = v; }, get fallers() { return fallers; }, openRoom, netTick, netClose, get pvp() { return pvp; }, get netStatus() { return netStatus; }, pick(k) { pickWho = k; }, step60(s) { for (let t = 0; t < s; t += 1 / 60) { sim60(); } }, get roster() { return ROSTER; }, TRIM, setMatch, get flames() { return flames; }, get rubble() { return rubble; }, get slides() { return slides; }, settings, show, startMatch, saveGame, loadGame, toMain, pause,
  get mode() { return mode; }, get screen() { return screen; }, get who() { return who; }, get foe() { return foe; },
  chooseFighter(name) { setMatch(name, 'cinder'); }, get rain() { return rain; }, get dyn() { return dynCount; }, E, get waves() { return waves; }, setFighting(v) { fighting = v; }, startMove, damageEnemy,
  get buildings() { return buildings; },
  sim(seconds) { for (let t = 0; t < seconds; t += STEP) { step(STEP); updateCollapse(STEP); updateLife(STEP); } },
  updateLife, get cars() { return cars; }, get civs() { return civs; }, get lifeBoxes() { return lifeCount; },
};
